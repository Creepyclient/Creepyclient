<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%">
  <defs>
    <!-- Clip for avatar circle -->
    <clipPath id="avatar-clip">
      <circle cx="150" cy="150" r="105"/>
    </clipPath>
    <!-- Clip for avatar rounded square -->
    <clipPath id="avatar-sq-clip">
      <rect x="45" y="45" width="210" height="210" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .bg { fill: #000000; }

    /* Outer card border draws itself */
    .card-border {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1;
      stroke-dasharray: 2560;
      stroke-dashoffset: 2560;
      animation: draw-border 2.5s cubic-bezier(0.4,0,0.2,1) 0.2s forwards;
    }

    /* Avatar frame draws itself */
    .avatar-frame {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: draw-border 2s cubic-bezier(0.4,0,0.2,1) 0.6s forwards;
    }

    /* Avatar image fades in */
    .avatar-img {
      animation: fade-in 0.8s ease 1.2s both;
    }

    /* Scanning line over avatar */
    .scan-line {
      stroke: #ffffff;
      stroke-width: 1;
      opacity: 0.3;
      animation: scan-avatar 4s linear 2s infinite;
    }

    /* Corner markers */
    .corner {
      stroke: #ffffff;
      stroke-width: 1.5;
      fill: none;
    }

    /* Node dot at avatar edge */
    .avatar-node {
      fill: #ffffff;
      animation: node-pulse 2.5s ease-in-out 2s infinite alternate;
    }

    /* Bio text lines stagger in */
    .bio-line-1 {
      animation: line-in 0.5s ease 1.4s both;
    }
    .bio-line-2 {
      animation: line-in 0.5s ease 1.7s both;
    }
    .bio-line-3 {
      animation: line-in 0.5s ease 2.0s both;
    }
    .bio-line-4 {
      animation: line-in 0.5s ease 2.3s both;
    }
    .bio-line-5 {
      animation: line-in 0.5s ease 2.6s both;
    }

    /* Stat rows */
    .stat-row-1 { animation: line-in 0.5s ease 2.9s both; }
    .stat-row-2 { animation: line-in 0.5s ease 3.1s both; }
    .stat-row-3 { animation: line-in 0.5s ease 3.3s both; }
    .stat-row-4 { animation: line-in 0.5s ease 3.5s both; }

    .section-label {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #555555;
      letter-spacing: 3px;
    }

    .bio-text {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #cccccc;
      line-height: 1.6;
    }

    .stat-key {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 400;
      fill: #555555;
      letter-spacing: 1px;
    }

    .stat-val {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #ffffff;
    }

    .divider-dash {
      stroke: #222222;
      stroke-width: 1;
      stroke-dasharray: 3 5;
    }

    .section-line {
      stroke: #ffffff;
      stroke-width: 1;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: draw-border 0.8s ease 1.2s forwards;
    }

    @keyframes draw-border {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes line-in {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scan-avatar {
      0% { y: 45px; opacity: 0; }
      5% { opacity: 0.4; }
      95% { opacity: 0.4; }
      100% { y: 255px; opacity: 0; }
    }
    @keyframes node-pulse {
      0% { r: 3px; opacity: 0.4; }
      100% { r: 5px; opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="1000" height="300" rx="10"/>

  <!-- Card border -->
  <rect class="card-border" x="2" y="2" width="996" height="296" rx="9"/>

  <!-- Left: Avatar block -->
  <g transform="translate(40, 0)">
    <!-- Avatar frame (rounded square) -->
    <rect class="avatar-frame" x="0" y="45" width="210" height="210" rx="12"/>

    <!-- Corner accents on avatar -->
    <g class="corner">
      <line x1="0" y1="62" x2="0" y2="45"/><line x1="0" y1="45" x2="17" y2="45"/>
      <line x1="193" y1="45" x2="210" y2="45"/><line x1="210" y1="45" x2="210" y2="62"/>
      <line x1="0" y1="238" x2="0" y2="255"/><line x1="0" y1="255" x2="17" y2="255"/>
      <line x1="193" y1="255" x2="210" y2="255"/><line x1="210" y1="255" x2="210" y2="238"/>
    </g>

    <!-- Avatar image -->
    <image class="avatar-img" href="https://raw.githubusercontent.com/Creepyclient/Creepyclient/main/assets/avatar.jpg"
      x="0" y="45" width="210" height="210" rx="12"
      clip-path="url(#avatar-sq-clip)"
      preserveAspectRatio="xMidYMid slice"/>

    <!-- Animated scan line over avatar -->
    <line class="scan-line" x1="0" y1="45" x2="210" y2="45"/>

    <!-- Node dots at corners -->
    <circle class="avatar-node" cx="0" cy="45" r="3.5"/>
    <circle class="avatar-node" cx="210" cy="45" r="3.5" style="animation-delay: 0.6s;"/>
    <circle class="avatar-node" cx="0" cy="255" r="3.5" style="animation-delay: 1.2s;"/>
    <circle class="avatar-node" cx="210" cy="255" r="3.5" style="animation-delay: 1.8s;"/>
  </g>

  <!-- Vertical divider -->
  <line class="divider-dash" x1="310" y1="30" x2="310" y2="270"/>

  <!-- Right: Bio block -->
  <g transform="translate(340, 0)">
    <!-- Label -->
    <text x="0" y="58" class="section-label bio-line-1">ABOUT</text>
    <line class="section-line" x1="0" y1="65" x2="200" y2="65"/>

    <!-- Bio paragraphs -->
    <text x="0" y="96" class="bio-text bio-line-2">First-year college student, full-stack engineer, and</text>
    <text x="0" y="118" class="bio-text bio-line-3">systems architect. I design and build software that</text>
    <text x="0" y="140" class="bio-text bio-line-4">prioritizes performance, clarity, and clean structure.</text>
    <text x="0" y="162" class="bio-text bio-line-5">Passionate about creating things that simply work well.</text>

    <!-- Stat separator -->
    <line class="divider-dash" x1="0" y1="182" x2="610" y2="182"/>

    <!-- Stats grid -->
    <g class="stat-row-1">
      <text x="0" y="210" class="stat-key">FOCUS</text>
      <text x="100" y="210" class="stat-val">Full-Stack · System Design · Web Performance</text>
    </g>
    <g class="stat-row-2">
      <text x="0" y="234" class="stat-key">STACK</text>
      <text x="100" y="234" class="stat-val">React · Next.js · Node.js · Docker · Linux</text>
    </g>
    <g class="stat-row-3">
      <text x="0" y="258" class="stat-key">BASED IN</text>
      <text x="100" y="258" class="stat-val">Open to remote collaboration worldwide</text>
    </g>
  </g>
</svg>
