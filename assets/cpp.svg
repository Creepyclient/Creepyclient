<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');

      .c-arc {
        fill: none;
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: draw-c 2s ease-out 0.6s forwards;
      }
      .plus-1-h {
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        animation: draw-line 0.4s ease-out 1.6s forwards;
      }
      .plus-1-v {
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        animation: draw-line 0.4s ease-out 1.8s forwards;
      }
      .plus-2-h {
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        animation: draw-line 0.4s ease-out 2.0s forwards;
      }
      .plus-2-v {
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 30;
        stroke-dashoffset: 30;
        animation: draw-line 0.4s ease-out 2.2s forwards;
      }
      .c-line {
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: draw-line 0.5s ease-out 1.4s forwards;
      }

      @keyframes draw-c {
        to { stroke-dashoffset: 0; }
      }
      @keyframes draw-line {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- 'C' arc: large bold C -->
  <!-- C arc: open circle from about 45° to 315° -->
  <path class="c-arc"
    d="M 50 30
       C 38 30, 20 42, 20 64
       C 20 86, 38 98, 50 98"/>

  <!-- Horizontal serif top of C -->
  <line class="c-line" x1="30" y1="30" x2="58" y2="30"/>
  <!-- Horizontal serif bottom of C -->
  <line class="c-line" x1="30" y1="98" x2="58" y2="98"
    style="animation-delay: 1.5s;"/>

  <!-- Plus sign 1 -->
  <!-- Horizontal bar -->
  <line class="plus-1-h" x1="72" y1="52" x2="98" y2="52"/>
  <!-- Vertical bar -->
  <line class="plus-1-v" x1="85" y1="39" x2="85" y2="65"/>

  <!-- Plus sign 2 -->
  <!-- Horizontal bar -->
  <line class="plus-2-h" x1="72" y1="82" x2="98" y2="82"/>
  <!-- Vertical bar -->
  <line class="plus-2-v" x1="85" y1="69" x2="85" y2="95"/>

  <!-- Plus outline boxes (subtle) -->
  <rect x="70" y="37" width="30" height="30" rx="2"
    fill="none" stroke="#ffffff" stroke-width="1"
    stroke-dasharray="120" stroke-dashoffset="120"
    style="animation: draw-line 0.8s ease-out 1.5s forwards;"/>
  <rect x="70" y="67" width="30" height="30" rx="2"
    fill="none" stroke="#ffffff" stroke-width="1"
    stroke-dasharray="120" stroke-dashoffset="120"
    style="animation: draw-line 0.8s ease-out 1.7s forwards;"/>
</svg>
