<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="100%">
  <defs>
    <!-- Cyan to Purple Gradient -->
    <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0" />
      <stop offset="15%" stop-color="#7c4dff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="85%" stop-color="#7c4dff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .line-base {
      fill: none;
      stroke: url(#cyan-purple-grad);
      stroke-width: 2;
    }
    
    .line-glow {
      fill: none;
      stroke: url(#cyan-purple-grad);
      stroke-width: 4;
      filter: url(#neon-glow);
      opacity: 0.8;
    }

    .pulse-dot {
      fill: #00f0ff;
      filter: url(#neon-glow);
      animation: move-dot 6s linear infinite;
    }

    @keyframes move-dot {
      0% { cx: 100; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 900; opacity: 0; }
    }
  </style>

  <!-- Glowing background line -->
  <path class="line-glow" d="M 0,10 L 1000,10" />

  <!-- Solid front line -->
  <path class="line-base" d="M 0,10 L 1000,10" />

  <!-- Sliding pulse dot -->
  <circle class="pulse-dot" cx="100" cy="10" r="3" />
  <circle class="pulse-dot" style="animation-delay: -3s;" cx="100" cy="10" r="2.5" />
</svg>
