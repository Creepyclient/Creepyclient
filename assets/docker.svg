    <path d="M110,65 C110,55 90,52 80,55 C70,40 55,42 45,45 C35,48 20,40 10,55 C10,75 30,90 60,90 C85,90 105,80 110,65 Z M102,68 C100,68 98,66 98,64 C98,62 100,60 102,60 C104,60 106,62 106,64 C106,66 104,68 102,68 Z" />
    <!-- Whale Tail -->
    <path d="M110,60 C115,55 120,45 122,35 C118,38 114,42 110,50 Z" />
    
    <!-- Cargo Boxes -->
    <!-- Column 1 -->
    <rect x="35" y="32" width="10" height="8" rx="1" />
    <rect x="35" y="22" width="10" height="8" rx="1" />
    <!-- Column 2 -->
    <rect x="47" y="32" width="10" height="8" rx="1" />
    <rect x="47" y="22" width="10" height="8" rx="1" />
    <rect x="47" y="12" width="10" height="8" rx="1" />
    <!-- Column 3 -->
    <rect x="59" y="32" width="10" height="8" rx="1" />
    <rect x="59" y="22" width="10" height="8" rx="1" />
    <rect x="59" y="12" width="10" height="8" rx="1" />
    <!-- Column 4 -->
    <rect x="71" y="32" width="10" height="8" rx="1" />
    <rect x="71" y="22" width="10" height="8" rx="1" />
  </g>
</svg>
