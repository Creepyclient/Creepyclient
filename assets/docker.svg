<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      .container {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: square;
        opacity: 0;
        transform-origin: center;
        animation: container-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .c1 { animation-delay: 0.6s; }
      .c2 { animation-delay: 0.8s; }
      .c3 { animation-delay: 1.0s; }
      .c4 { animation-delay: 1.2s; }
      .c5 { animation-delay: 1.4s; }

      .connector {
        stroke: #ffffff;
        stroke-width: 1.5;
        opacity: 0;
        animation: fade-in 0.2s ease-out forwards;
      }
      .l1 { animation-delay: 1.1s; }
      .l2 { animation-delay: 1.3s; }
      .l3 { animation-delay: 1.5s; }

      .whale-body {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-dasharray: 280;
        stroke-dashoffset: 280;
        animation: draw-whale 1.5s ease-out 0.4s forwards;
      }
      .whale-fill {
        fill: #ffffff;
        opacity: 0;
        animation: fade-in 0.3s ease-out 1.7s forwards;
      }

      @keyframes container-pop {
        0% { opacity: 0; transform: scale(0.5) translateY(8px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes draw-whale {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fade-in {
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- Docker whale body (minimal silhouette) -->
  <path class="whale-body"
    d="M 20 82
       C 20 75, 26 70, 34 70
       L 36 70
       C 37 64, 42 60, 50 60
       L 88 60
       C 96 60, 100 65, 100 72
       C 108 72, 114 76, 114 84
       C 114 92, 108 96, 100 96
       L 34 96
       C 26 96, 20 90, 20 82 Z"/>

  <!-- Water spout -->
  <path class="whale-body"
    d="M 104 60 L 108 48 M 108 48 C 108 44, 112 40, 116 44"
    style="stroke-dasharray:60; stroke-dashoffset:60; animation-delay:1.4s;"/>

  <!-- Container rows — bottom row: 3 containers -->
  <!-- Container 1 (bottom-left) -->
  <rect class="container c1" x="26" y="65" width="20" height="18" rx="1"
    style="transform-origin: 36px 74px;"/>
  <!-- Container 2 (bottom-mid) -->
  <rect class="container c2" x="50" y="65" width="20" height="18" rx="1"
    style="transform-origin: 60px 74px;"/>
  <!-- Container 3 (bottom-right) -->
  <rect class="container c3" x="74" y="65" width="20" height="18" rx="1"
    style="transform-origin: 84px 74px;"/>

  <!-- Top row: 2 containers -->
  <!-- Container 4 (top-left) -->
  <rect class="container c4" x="26" y="43" width="20" height="18" rx="1"
    style="transform-origin: 36px 52px;"/>
  <!-- Container 5 (top-right) -->
  <rect class="container c5" x="50" y="43" width="20" height="18" rx="1"
    style="transform-origin: 60px 52px;"/>

  <!-- Connector lines between container rows -->
  <line class="connector l1" x1="36" y1="61" x2="36" y2="65"/>
  <line class="connector l2" x1="60" y1="61" x2="60" y2="65"/>
  <line class="connector l3" x1="84" y1="61" x2="84" y2="65"/>
</svg>
