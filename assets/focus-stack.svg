<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" style="display:block;">
  <defs>
    <pattern id="stack-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#141414" />
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;family=JetBrains+Mono:wght@300;400;700&amp;display=swap');

      /* Outer border draw */
      .outer-border {
        fill: none;
        stroke: #ffffff;
        stroke-width: 1;
        stroke-dasharray: 2460;
        stroke-dashoffset: 2460;
        animation: drawOuter 1.6s cubic-bezier(0.77, 0, 0.175, 1) 0.1s forwards;
      }
      @keyframes drawOuter {
        to { stroke-dashoffset: 0; }
      }

      /* Title */
      .main-title {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #ffffff;
        letter-spacing: 3px;
        opacity: 0;
        animation: fadeUp 0.6s ease 1.7s forwards;
      }
      @keyframes fadeUp {
        0%  { opacity: 0; transform: translateY(8px); }
        100%{ opacity: 1; transform: translateY(0); }
      }

      /* Title underline draws itself */
      .title-underline {
        stroke: #ffffff;
        stroke-width: 0.8;
        stroke-dasharray: 920;
        stroke-dashoffset: 920;
        animation: drawUnder 2s cubic-bezier(0.77, 0, 0.175, 1) 1.9s forwards;
        opacity: 0.6;
      }
      @keyframes drawUnder {
        to { stroke-dashoffset: 0; }
      }

      /* Card: slide in from translateY(30px) + opacity 0 */
      /* Card borders are drawn using stroke-dasharray */
      .card-bg {
        fill: #000000;
      }
      .card-border {
        fill: none;
        stroke: #ffffff;
        stroke-width: 1;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawCard 1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        rx: 3;
      }
      .card-1-border { animation-delay: 2.2s; }
      .card-2-border { animation-delay: 2.5s; }
      .card-3-border { animation-delay: 2.8s; }

      /* Card group slide in */
      .card-group {
        opacity: 0;
        transform: translateY(30px);
        animation: slideCard 0.7s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
      }
      .card-group-1 { animation-delay: 2.1s; }
      .card-group-2 { animation-delay: 2.4s; }
      .card-group-3 { animation-delay: 2.7s; }

      @keyframes slideCard {
        0%   { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Card title */
      .card-title {
        font-family: 'Inter', 'Space Grotesk', system-ui, sans-serif;
        font-size: 12px;
        fill: #ffffff;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      /* Card body */
      .card-body {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 10px;
        fill: #888888;
        font-weight: 400;
        leading-trim: both;
        text-edge: cap alphabetic;
      }
      /* Tag */
      .tag-rect {
        fill: none;
        stroke: #ffffff;
        stroke-width: 0.8;
        rx: 2;
        opacity: 0.6;
      }
      .tag-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8px;
        fill: #ffffff;
        letter-spacing: 1.5px;
        opacity: 0.7;
      }

      /* Tag glow on hover sim */
      .tag-group {
        animation: tagFade 0.5s ease forwards;
        opacity: 0;
      }
      .tag-group-1 { animation-delay: 3.0s; }
      .tag-group-2 { animation-delay: 3.3s; }
      .tag-group-3 { animation-delay: 3.6s; }
      @keyframes tagFade {
        0%  { opacity: 0; }
        100%{ opacity: 1; }
      }
    </style>
    <filter id="borderGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="1000" height="230" fill="#000000" rx="4"/>
  <rect width="1000" height="230" fill="url(#stack-grid)" rx="4"/>

  <!-- Outer border (self-drawing) -->
  <rect class="outer-border" x="1" y="1" width="998" height="228" rx="4" filter="url(#borderGlow)"/>

  <!-- SPECIALIZATIONS title -->
  <text class="main-title" x="40" y="44">SPECIALIZATIONS</text>
  <!-- Underline draws itself from left to right -->
  <line class="title-underline" x1="40" y1="52" x2="960" y2="52"/>

  <!-- ═══════════════ CARD 1: System Architecture (x: 40–300) ═══════════════ -->
  <g class="card-group card-group-1">
    <!-- Card bg -->
    <rect class="card-bg" x="40" y="68" width="260" height="144" rx="3"/>
    <!-- Card border (self-drawing) -->
    <rect class="card-border card-1-border" x="40" y="68" width="260" height="144" rx="3"/>

    <!-- Card content -->
    <text class="card-title" x="58" y="98">System Architecture</text>
    <text class="card-body" x="58" y="120">Decoupled microservices,</text>
    <text class="card-body" x="58" y="135">API design, distributed</text>
    <text class="card-body" x="58" y="150">state management.</text>

    <!-- Tag: SCALABLE -->
    <g class="tag-group tag-group-1">
      <rect class="tag-rect" x="58" y="184" width="72" height="16" rx="2"/>
      <text class="tag-text" x="94" y="196" text-anchor="middle">SCALABLE</text>
    </g>
  </g>

  <!-- ═══════════════ CARD 2: Full-Stack Development (x: 360–620) ═══════════════ -->
  <g class="card-group card-group-2">
    <rect class="card-bg" x="370" y="68" width="260" height="144" rx="3"/>
    <rect class="card-border card-2-border" x="370" y="68" width="260" height="144" rx="3"/>

    <text class="card-title" x="388" y="98">Full-Stack Development</text>
    <text class="card-body" x="388" y="120">React, Next.js, and</text>
    <text class="card-body" x="388" y="135">robust backend services</text>
    <text class="card-body" x="388" y="150">built for production.</text>

    <!-- Tag: INTEGRATED -->
    <g class="tag-group tag-group-2">
      <rect class="tag-rect" x="388" y="184" width="80" height="16" rx="2"/>
      <text class="tag-text" x="428" y="196" text-anchor="middle">INTEGRATED</text>
    </g>
  </g>

  <!-- ═══════════════ CARD 3: Performance & Quality (x: 680–940) ═══════════════ -->
  <g class="card-group card-group-3">
    <rect class="card-bg" x="700" y="68" width="260" height="144" rx="3"/>
    <rect class="card-border card-3-border" x="700" y="68" width="260" height="144" rx="3"/>

    <text class="card-title" x="718" y="98">Performance &amp; Quality</text>
    <text class="card-body" x="718" y="120">Web Vitals, code audits,</text>
    <text class="card-body" x="718" y="135">runtime optimizations,</text>
    <text class="card-body" x="718" y="150">zero-regression policy.</text>

    <!-- Tag: OPTIMIZED -->
    <g class="tag-group tag-group-3">
      <rect class="tag-rect" x="718" y="184" width="76" height="16" rx="2"/>
      <text class="tag-text" x="756" y="196" text-anchor="middle">OPTIMIZED</text>
    </g>
  </g>
</svg>
