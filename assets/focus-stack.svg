<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030508" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .background {
      fill: url(#bg-gradient);
    }

    .stack-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 2.5px;
    }

    .stack-header-line {
      stroke: url(#primary-glow);
      stroke-width: 1;
    }

    .stack-card {
      fill: #060910;
      stroke: #121a24;
      stroke-width: 1.2;
      rx: 6px;
    }

    .stack-card:hover {
      stroke: #00f5d4;
    }

    .card-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }

    .card-desc {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #6b7c96;
      line-height: 1.6;
    }

    .card-tag {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 10px;
      fill: #00f5d4;
    }

    .tag-border {
      fill: none;
      stroke: #00f5d4;
      stroke-width: 1;
      rx: 2px;
      opacity: 0.7;
    }

    .indicator-node {
      fill: #7b2cbf;
      filter: url(#soft-glow);
      animation: pulse-node 2.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-node {
      0% { fill: #7b2cbf; r: 3px; }
      100% { fill: #00f5d4; r: 4.5px; }
    }
  </style>

  <!-- Background Base -->
  <rect class="background" width="1000" height="220" rx="10" stroke="#121a24" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" class="stack-title">SYSTEM ARCHITECTURE SPECIALIZATIONS</text>
    <line x1="0" y1="10" x2="920" y2="10" class="stack-header-line" />
  </g>

  <!-- Card 1: System Design -->
  <g transform="translate(40, 70)">
    <rect class="stack-card" width="280" height="110" />
    <circle class="indicator-node" cx="250" cy="25" r="4" />
    
    <g transform="translate(20, 25)">
      <text x="0" y="5" class="card-label">System Architecture</text>
      <text x="0" y="32" class="card-desc">Decoupled microservices,</text>
      <text x="0" y="50" class="card-desc">API design, &amp; state engines.</text>
      
      <rect x="0" y="66" width="95" height="18" class="tag-border" />
      <text x="8" y="78" class="card-tag">SCALABILITY</text>
    </g>
  </g>

  <!-- Card 2: Full-Stack -->
  <g transform="translate(360, 70)">
    <rect class="stack-card" width="280" height="110" />
    <circle class="indicator-node" style="animation-delay: -0.8s;" cx="250" cy="25" r="4" />
    
    <g transform="translate(20, 25)">
      <text x="0" y="5" class="card-label">Full-Stack Systems</text>
      <text x="0" y="32" class="card-desc">Modern React systems,</text>
      <text x="0" y="50" class="card-desc">Next.js, &amp; robust backends.</text>
      
      <rect x="0" y="66" width="95" height="18" class="tag-border" />
      <text x="8" y="78" class="card-tag">INTEGRATION</text>
    </g>
  </g>

  <!-- Card 3: Quality -->
  <g transform="translate(680, 70)">
    <rect class="stack-card" width="280" height="110" />
    <circle class="indicator-node" style="animation-delay: -1.6s;" cx="250" cy="25" r="4" />
    
    <g transform="translate(20, 25)">
      <text x="0" y="5" class="card-label">Quality &amp; Performance</text>
      <text x="0" y="32" class="card-desc">Web Vitals analysis, audits,</text>
      <text x="0" y="50" class="card-desc">&amp; runtime optimizations.</text>
      
      <rect x="0" y="66" width="85" height="18" class="tag-border" />
      <text x="8" y="78" class="card-tag">EFFICIENCY</text>
    </g>
  </g>
</svg>
