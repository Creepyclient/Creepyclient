<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0c101b" />
    </linearGradient>
    
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .stack-title {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #ffffff;
      letter-spacing: 2px;
    }

    .stack-header-line {
      stroke: url(#cyan-purple);
      stroke-width: 1.5;
    }

    .stack-card {
      fill: #0c1220;
      stroke: #172237;
      stroke-width: 1.2;
      rx: 6px;
      transition: all 0.3s ease;
    }

    .stack-card:hover {
      stroke: #00f0ff;
    }

    .card-label {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 1px;
    }

    .card-desc {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #8b9bb4;
    }

    .card-tag {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 10px;
      fill: #00f0ff;
    }

    .tag-border {
      fill: none;
      stroke: #00f0ff;
      stroke-width: 1;
      rx: 2px;
      opacity: 0.8;
    }

    .glow-dot {
      fill: #7c4dff;
      filter: url(#neon-glow);
      animation: pulse-dot 2.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-dot {
      0% { fill: #7c4dff; r: 3px; }
      100% { fill: #00f0ff; r: 5px; }
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="220" rx="10" fill="url(#bg-grad)" stroke="#121b2d" stroke-width="1.5" />

  <!-- Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" class="stack-title">TECHNICAL CORE SPECIALIZATION</text>
    <line x1="0" y1="10" x2="920" y2="10" class="stack-header-line" />
  </g>

  <!-- Card 1: System Design -->
  <g transform="translate(40, 70)">
    <rect class="stack-card" width="280" height="110" />
    <circle class="glow-dot" cx="245" cy="25" r="4" />
    
    <g transform="translate(20, 25)">
      <text x="0" y="5" class="card-label">System Architecture</text>
      <text x="0" y="30" class="card-desc">Decoupled microservices &amp;</text>
      <text x="0" y="48" class="card-desc">distributed state machines.</text>
      
      <!-- Tag -->
      <rect x="0" y="65" width="95" height="18" class="tag-border" />
      <text x="8" y="77" class="card-tag">SCALABILITY</text>
    </g>
  </g>

  <!-- Card 2: Full-Stack Web -->
  <g transform="translate(360, 70)">
    <rect class="stack-card" width="280" height="110" />
    <circle class="glow-dot" style="animation-delay: -0.8s;" cx="245" cy="25" r="4" />
    
    <g transform="translate(20, 25)">
      <text x="0" y="5" class="card-label">Full-Stack Development</text>
      <text x="0" y="30" class="card-desc">React, Node.js &amp; modern client</text>
      <text x="0" y="48" class="card-desc">rendering frameworks.</text>
      
      <!-- Tag -->
      <rect x="0" y="65" width="85" height="18" class="tag-border" />
      <text x="8" y="77" class="card-tag">INTEGRATION</text>
    </g>
  </g>

  <!-- Card 3: Optimization & Audit -->
  <g transform="translate(680, 70)">
    <rect class="stack-card" width="280" height="110" />
    <circle class="glow-dot" style="animation-delay: -1.6s;" cx="245" cy="25" r="4" />
    
    <g transform="translate(20, 25)">
      <text x="0" y="5" class="card-label">Performance &amp; Quality</text>
      <text x="0" y="30" class="card-desc">Web Vitals profiling, clean code</text>
      <text x="0" y="48" class="card-desc">standards &amp; security audits.</text>
      
      <!-- Tag -->
      <rect x="0" y="65" width="80" height="18" class="tag-border" />
      <text x="8" y="77" class="card-tag">EFFICIENCY</text>
    </g>
  </g>
</svg>
