<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="42" height="42">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Git Diamond Boarder -->
  <rect x="25" y="25" width="78" height="78" rx="8" fill="none" stroke="#7c4dff" stroke-width="3.5" transform="rotate(45 64 64)" filter="url(#glow)" />
  
  <!-- Git Nodes & Branches -->
  <g stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)">
    <!-- Main stem -->
    <line x1="48" y1="36" x2="48" y2="92" />
    <!-- Branch -->
    <path d="M48,68 C64,68 80,60 80,48" />
  </g>
  <!-- Node Dots -->
  <g fill="#00f0ff" filter="url(#glow)">
    <circle cx="48" cy="38" r="7.5" />
    <circle cx="48" cy="90" r="7.5" fill="#7c4dff" />
    <circle cx="80" cy="46" r="7.5" />
  </g>
</svg>
