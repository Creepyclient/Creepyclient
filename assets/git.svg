<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      /* Line 1: main trunk vertical */
      .line-trunk {
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: draw-line 0.6s ease-out 0.8s forwards;
      }
      /* Line 2: branch to node 2 */
      .line-branch1 {
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: draw-line 0.5s ease-out 1.3s forwards;
      }
      /* Line 3: branch to node 3 */
      .line-branch2 {
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: draw-line 0.5s ease-out 1.5s forwards;
      }
      /* Line 4: merge line */
      .line-merge {
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: draw-line 0.5s ease-out 1.9s forwards;
      }

      .node {
        fill: #000000;
        stroke: #ffffff;
        stroke-width: 2.5;
        opacity: 0;
        animation: node-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .n1 { animation-delay: 0.8s; }
      .n2 { animation-delay: 1.4s; }
      .n3 { animation-delay: 1.6s; }
      .n4 { animation-delay: 2.0s; }
      .n5 { animation-delay: 2.1s; }

      .node-fill {
        fill: #ffffff;
        opacity: 0;
        animation: node-pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes draw-line {
        to { stroke-dashoffset: 0; }
      }
      @keyframes node-pop {
        0% { opacity: 0; transform: scale(0); }
        100% { opacity: 1; transform: scale(1); }
      }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="128" height="128" fill="#000000"/>

  <!--
    Layout:
    Node1 (commit) at (40, 90) — bottom-left (initial commit)
    Node2 (main)   at (40, 50) — middle-left
    Node3 (branch) at (88, 68) — right (feature branch)
    Node4 (merge)  at (40, 24) — top-left (merged HEAD)

    Lines:
    trunk: Node1 -> Node2 (vertical left)
    branch-out: Node2 -> Node3
    branch: Node3 vertical stub (optional)
    merge: Node3 -> Node4
    trunk: Node2 -> Node4
  -->

  <!-- Trunk line: Node1 (40,90) to Node2 (40,50) -->
  <line class="line-trunk" x1="40" y1="90" x2="40" y2="50"/>

  <!-- Trunk line: Node2 (40,50) to Node4 (40,24) -->
  <line class="line-branch1" x1="40" y1="50" x2="40" y2="24"
    style="stroke-dasharray:30; stroke-dashoffset:30; animation-delay:1.4s;"/>

  <!-- Branch out: Node2 (40,50) to Node3 (88,68) -->
  <line class="line-branch2" x1="40" y1="50" x2="88" y2="68"/>

  <!-- Merge back: Node3 (88,68) to Node4 (40,24) -->
  <line class="line-merge" x1="88" y1="68" x2="40" y2="24"
    style="stroke-dasharray:62; stroke-dashoffset:62;"/>

  <!-- Node 1: initial commit (hollow) -->
  <circle class="node n1" cx="40" cy="90" r="7" style="transform-origin: 40px 90px;"/>

  <!-- Node 2: branch point -->
  <circle class="node n2" cx="40" cy="50" r="7" style="transform-origin: 40px 50px;"/>

  <!-- Node 3: feature commit (filled) -->
  <circle class="node n3" cx="88" cy="68" r="7" style="transform-origin: 88px 68px;"/>
  <circle class="node-fill n3" cx="88" cy="68" r="3.5" style="transform-origin: 88px 68px; animation-delay:1.65s;"/>

  <!-- Node 4: HEAD / merge commit -->
  <circle class="node n4" cx="40" cy="24" r="9" style="transform-origin: 40px 24px;"/>
  <!-- HEAD filled center -->
  <circle class="node-fill n4" cx="40" cy="24" r="4.5" style="transform-origin: 40px 24px; animation-delay:2.05s;"/>

  <!-- Node 5: tag label stub -->
  <rect class="node n5" x="48" y="18" width="30" height="12" rx="3"
    style="transform-origin: 63px 24px; fill:#000000; stroke:#ffffff; stroke-width:1.5;"/>
  <text x="63" y="26" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#ffffff"
    style="opacity:0; animation: node-pop 0.3s ease-out 2.15s forwards; transform-origin:63px 24px;">HEAD</text>
</svg>
