<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030508" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Unified Palette Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .background {
      fill: url(#bg-gradient);
    }

    .matrix-dot {
      fill: #141f30;
      opacity: 0.3;
    }

    .matrix-dot-animated {
      fill: #00f5d4;
      animation: pulse-dot 4s ease-in-out infinite alternate;
    }

    .wave-path {
      fill: none;
      stroke: url(#primary-glow);
      stroke-width: 1.2;
      opacity: 0.25;
      stroke-dasharray: 1200;
      stroke-dashoffset: 0;
      animation: wave-flow 12s linear infinite;
    }

    .name-text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .role-text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #00f5d4;
      letter-spacing: 5px;
      filter: url(#soft-glow);
    }

    .tagline-text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #6b7c96;
      letter-spacing: 0.5px;
    }

    .accent-bar {
      fill: url(#primary-glow);
      rx: 2px;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.1; r: 1.5px; }
      100% { opacity: 0.7; r: 3.5px; filter: drop-shadow(0 0 4px #00f5d4); }
    }

    @keyframes wave-flow {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="300" rx="12" class="background" stroke="#121a24" stroke-width="1.5" />

  <!-- Designer Abstract Dot Matrix Grid -->
  <g>
    <!-- Column 1 -->
    <circle class="matrix-dot" cx="80" cy="50" r="1.5" />
    <circle class="matrix-dot" cx="80" cy="100" r="1.5" />
    <circle class="matrix-dot" cx="80" cy="150" r="1.5" />
    <circle class="matrix-dot" cx="80" cy="200" r="1.5" />
    <circle class="matrix-dot" cx="80" cy="250" r="1.5" />
    <!-- Column 2 -->
    <circle class="matrix-dot" cx="160" cy="50" r="1.5" />
    <circle class="matrix-dot-animated" cx="160" cy="100" r="1.5" />
    <circle class="matrix-dot" cx="160" cy="150" r="1.5" />
    <circle class="matrix-dot" cx="160" cy="200" r="1.5" />
    <circle class="matrix-dot" cx="160" cy="250" r="1.5" />
    <!-- Column 3 -->
    <circle class="matrix-dot" cx="240" cy="50" r="1.5" />
    <circle class="matrix-dot" cx="240" cy="100" r="1.5" />
    <circle class="matrix-dot" cx="240" cy="150" r="1.5" />
    <circle class="matrix-dot-animated" style="animation-delay: -2s;" cx="240" cy="200" r="1.5" />
    <circle class="matrix-dot" cx="240" cy="250" r="1.5" />
    <!-- Additional columns at the right edge -->
    <circle class="matrix-dot" cx="840" cy="50" r="1.5" />
    <circle class="matrix-dot" cx="840" cy="100" r="1.5" />
    <circle class="matrix-dot-animated" cx="840" cy="150" r="1.5" />
    <circle class="matrix-dot" cx="840" cy="200" r="1.5" />
    <circle class="matrix-dot" cx="840" cy="250" r="1.5" />

    <circle class="matrix-dot" cx="920" cy="50" r="1.5" />
    <circle class="matrix-dot" cx="920" cy="100" r="1.5" />
    <circle class="matrix-dot" cx="920" cy="150" r="1.5" />
    <circle class="matrix-dot" cx="920" cy="200" r="1.5" />
    <circle class="matrix-dot-animated" style="animation-delay: -1.5s;" cx="920" cy="250" r="1.5" />
  </g>

  <!-- Elegant Abstract Vector Sine Curve -->
  <path class="wave-path" d="M -50,150 Q 200,80 450,160 T 950,140 T 1050,150" />
  <path class="wave-path" style="animation-delay: -6s; opacity: 0.12;" d="M -50,160 Q 250,220 500,140 T 1000,160 T 1050,160" />

  <!-- Clean, Centered Typography -->
  <g transform="translate(120, 0)">
    <!-- Decorative side line -->
    <rect x="-30" y="105" width="3" height="90" class="accent-bar" filter="url(#soft-glow)" />

    <!-- Name -->
    <text x="0" y="132" class="name-text">Neyamul Islam <tspan fill="url(#primary-glow)">(Creepyclient)</tspan></text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="165" class="role-text">SYSTEMS ARCHITECT &amp; ENGINEER</text>

    <!-- Tagline -->
    <text x="0" y="196" class="tagline-text">Transforming complex logic into elegant, high-velocity software solutions</text>

    <!-- Minimal underline accent -->
    <rect x="0" y="222" width="80" height="2" class="accent-bar" />
    <rect x="90" y="222" width="10" height="2" fill="#00f5d4" />
  </g>
</svg>
