<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%">
  <defs>
    <clipPath id="grid-clip">
      <rect width="1000" height="320" />
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');

    .bg { fill: #000000; }
    .border-rect {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1;
      stroke-dasharray: 2640;
      stroke-dashoffset: 2640;
      animation: draw-border 3s cubic-bezier(0.4,0,0.2,1) 0.3s forwards;
    }

    /* Blueprint grid lines */
    .grid-h, .grid-v {
      stroke: #111111;
      stroke-width: 1;
    }

    /* Grid assembles column by column */
    .grid-col-1 { animation: grid-reveal 0.4s ease 0.5s both; }
    .grid-col-2 { animation: grid-reveal 0.4s ease 0.65s both; }
    .grid-col-3 { animation: grid-reveal 0.4s ease 0.8s both; }
    .grid-col-4 { animation: grid-reveal 0.4s ease 0.95s both; }
    .grid-col-5 { animation: grid-reveal 0.4s ease 1.1s both; }
    .grid-col-6 { animation: grid-reveal 0.4s ease 1.25s both; }
    .grid-col-7 { animation: grid-reveal 0.4s ease 1.4s both; }
    .grid-col-8 { animation: grid-reveal 0.4s ease 1.55s both; }
    .grid-col-9 { animation: grid-reveal 0.4s ease 1.7s both; }
    .grid-col-10 { animation: grid-reveal 0.4s ease 1.85s both; }

    /* Side accent line */
    .accent-line {
      stroke: #ffffff;
      stroke-width: 2;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: draw-line 0.8s ease 1.2s forwards;
    }

    /* Name — typewriter via clip-path width reveal */
    .name-clip {
      animation: reveal-text 1.2s steps(30, end) 1.5s both;
    }
    .name-text {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .name-highlight {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 1;
      letter-spacing: -1px;
    }

    /* Cursor blink */
    .cursor {
      fill: #ffffff;
      animation: blink 0.8s step-start 2.8s infinite;
    }

    /* Role badge */
    .role-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 700;
      font-size: 13px;
      fill: #888888;
      letter-spacing: 4px;
      animation: fade-up 0.6s ease 2.2s both;
    }

    /* Tagline */
    .tagline-text {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #555555;
      letter-spacing: 0.3px;
      animation: fade-up 0.6s ease 2.5s both;
    }

    /* Underline bar draws itself */
    .underline-bar {
      stroke: #ffffff;
      stroke-width: 2;
      stroke-dasharray: 90;
      stroke-dashoffset: 90;
      animation: draw-line 0.5s ease 2.7s forwards;
    }
    .underline-dot {
      fill: #ffffff;
      animation: pop-in 0.3s ease 3.3s both;
    }

    /* Corner cross accents */
    .corner-cross {
      stroke: #333333;
      stroke-width: 1;
      fill: none;
      animation: fade-in 0.3s ease 0.3s both;
    }

    /* Ambient particle dots */
    .ambient-dot {
      fill: #222222;
      animation: ambient-float 8s ease-in-out infinite alternate;
    }
    .ambient-dot-2 {
      fill: #333333;
      animation: ambient-float 12s ease-in-out infinite alternate;
    }

    @keyframes draw-border {
      to { stroke-dashoffset: 0; }
    }
    @keyframes draw-line {
      to { stroke-dashoffset: 0; }
    }
    @keyframes grid-reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes reveal-text {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0% 0 0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop-in {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes ambient-float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(8px, -12px); }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="1000" height="320" rx="10" />

  <!-- Blueprint grid columns assembling -->
  <g clip-path="url(#grid-clip)">
    <g class="grid-col-1"><line class="grid-v" x1="100" y1="0" x2="100" y2="320"/></g>
    <g class="grid-col-2"><line class="grid-v" x1="200" y1="0" x2="200" y2="320"/></g>
    <g class="grid-col-3"><line class="grid-v" x1="300" y1="0" x2="300" y2="320"/></g>
    <g class="grid-col-4"><line class="grid-v" x1="400" y1="0" x2="400" y2="320"/></g>
    <g class="grid-col-5"><line class="grid-v" x1="500" y1="0" x2="500" y2="320"/></g>
    <g class="grid-col-6"><line class="grid-v" x1="600" y1="0" x2="600" y2="320"/></g>
    <g class="grid-col-7"><line class="grid-v" x1="700" y1="0" x2="700" y2="320"/></g>
    <g class="grid-col-8"><line class="grid-v" x1="800" y1="0" x2="800" y2="320"/></g>
    <g class="grid-col-9"><line class="grid-v" x1="900" y1="0" x2="900" y2="320"/></g>
    <line class="grid-h" x1="0" y1="80" x2="1000" y2="80"/>
    <line class="grid-h" x1="0" y1="160" x2="1000" y2="160"/>
    <line class="grid-h" x1="0" y1="240" x2="1000" y2="240"/>
  </g>

  <!-- Ambient floating dots -->
  <circle class="ambient-dot" cx="920" cy="60" r="40" opacity="0.3"/>
  <circle class="ambient-dot-2" cx="850" cy="260" r="25" opacity="0.2"/>
  <circle class="ambient-dot" cx="50" cy="270" r="30" opacity="0.2"/>

  <!-- Corner cross accents -->
  <g class="corner-cross">
    <line x1="20" y1="15" x2="30" y2="15"/><line x1="25" y1="10" x2="25" y2="20"/>
    <line x1="970" y1="15" x2="980" y2="15"/><line x1="975" y1="10" x2="975" y2="20"/>
    <line x1="20" y1="305" x2="30" y2="305"/><line x1="25" y1="300" x2="25" y2="310"/>
    <line x1="970" y1="305" x2="980" y2="305"/><line x1="975" y1="300" x2="975" y2="310"/>
  </g>

  <!-- Animated border -->
  <rect class="border-rect" x="2" y="2" width="996" height="316" rx="9"/>

  <!-- Left side accent vertical line -->
  <line class="accent-line" x1="90" y1="115" x2="90" y2="215"/>

  <!-- Content block -->
  <g transform="translate(110, 0)">
    <!-- Role label — appears first -->
    <text x="0" y="130" class="role-text">SYSTEMS ARCHITECT &amp; ENGINEER</text>

    <!-- Name with typewriter reveal -->
    <g style="clip-path: inset(0 0% 0 0);" class="name-clip">
      <text x="0" y="182" class="name-text">Neyamul Islam</text>
    </g>

    <!-- Cursor blinking after name -->
    <rect class="cursor" x="375" y="155" width="3" height="36" rx="1"/>

    <!-- Tagline -->
    <text x="0" y="218" class="tagline-text">Transforming complex logic into elegant, high-velocity software solutions.</text>

    <!-- Underline bar -->
    <line class="underline-bar" x1="0" y1="238" x2="90" y2="238"/>
    <circle class="underline-dot" cx="97" cy="238" r="2.5"/>
  </g>
</svg>
