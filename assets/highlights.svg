<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#141414" />
    </pattern>

    <style>
      /* Font stacks */
      .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .font-grotesk { font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif; }

      /* Base animations */
      .fade-in {
        opacity: 0;
        animation: fadeIn 0.8s ease forwards;
      }
      @keyframes fadeIn {
        to { opacity: 1; }
      }

      /* Border Drawing */
      .border-rect {
        fill: none;
        stroke: #ffffff;
        stroke-width: 1;
        stroke-dasharray: 2360;
        stroke-dashoffset: 2360;
        animation: drawBorder 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes drawBorder {
        to { stroke-dashoffset: 0; }
      }

      /* Separator Drawing */
      .sep {
        stroke: #222222;
        stroke-width: 1;
        stroke-dasharray: 140;
        stroke-dashoffset: 140;
        animation: drawSep 0.8s ease 1s forwards;
      }
      @keyframes drawSep {
        to { stroke-dashoffset: 0; }
      }

      /* Stat block slide-in (wrapped safety) */
      .stat-block {
        opacity: 0;
        animation: statSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .stat-1 { animation-delay: 0.4s; }
      .stat-2 { animation-delay: 0.6s; }
      .stat-3 { animation-delay: 0.8s; }
      .stat-4 { animation-delay: 1.0s; }

      @keyframes statSlide {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Telemetry scanner line */
      .scanline {
        stroke: #ffffff;
        stroke-width: 1;
        opacity: 0.15;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(0); }
        100% { transform: translateY(180px); }
      }

      /* Corner accents */
      .corner { stroke: #444444; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <!-- Background and Dotted Grid -->
  <rect width="1000" height="180" fill="#000000" />
  <rect width="1000" height="180" fill="url(#grid)" />

  <!-- Animated Scanline -->
  <line class="scanline" x1="0" y1="0" x2="1000" y2="0" />

  <!-- Outer Border -->
  <rect class="border-rect" x="1" y="1" width="998" height="178" rx="0" />

  <!-- Corner Brackets -->
  <g class="corner fade-in" style="animation-delay: 0.2s;">
    <path d="M 1,18 L 1,1 L 18,1" />
    <path d="M 982,1 L 999,1 L 999,18" />
    <path d="M 1,162 L 1,179 L 18,179" />
    <path d="M 982,179 L 999,179 L 999,162" />
  </g>

  <!-- Telemetry Marks -->
  <g class="font-mono fade-in" font-size="7" fill="#444444" style="animation-delay: 0.3s;">
    <text x="24" y="18">[SYS_METRIC: 0x4F9]</text>
    <text x="976" y="18" text-anchor="end">LOC_RUN: 01</text>
    <text x="24" y="166">[REF_T: 2026.06]</text>
    <text x="976" y="166" text-anchor="end">STATUS: OK</text>
  </g>

  <!-- Separators -->
  <line class="sep" x1="250" y1="20" x2="250" y2="160" />
  <line class="sep" x1="500" y1="20" x2="500" y2="160" />
  <line class="sep" x1="750" y1="20" x2="750" y2="160" />

  <!-- STAT 1: CONTRIBUTIONS -->
  <g transform="translate(125, 90)">
    <g class="stat-block stat-1">
      <text class="font-grotesk" x="0" y="-10" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">721+</text>
      <text class="font-mono" x="0" y="32" font-size="9" fill="#888888" letter-spacing="2" text-anchor="middle">CONTRIBUTIONS</text>
      <rect x="-40" y="48" width="80" height="2" fill="#222222" />
      <rect class="fade-in" style="animation-delay: 1.2s;" x="-20" y="48" width="40" height="2" fill="#ffffff" />
    </g>
  </g>

  <!-- STAT 2: ACTIVE REPOS -->
  <g transform="translate(375, 90)">
    <g class="stat-block stat-2">
      <text class="font-grotesk" x="0" y="-10" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">4</text>
      <text class="font-mono" x="0" y="32" font-size="9" fill="#888888" letter-spacing="2" text-anchor="middle">ACTIVE REPOS</text>
      <rect x="-40" y="48" width="80" height="2" fill="#222222" />
      <rect class="fade-in" style="animation-delay: 1.4s;" x="-30" y="48" width="60" height="2" fill="#ffffff" />
    </g>
  </g>

  <!-- STAT 3: LANGUAGES -->
  <g transform="translate(625, 90)">
    <g class="stat-block stat-3">
      <text class="font-grotesk" x="0" y="-10" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">8+</text>
      <text class="font-mono" x="0" y="32" font-size="9" fill="#888888" letter-spacing="2" text-anchor="middle">LANGUAGES</text>
      <rect x="-40" y="48" width="80" height="2" fill="#222222" />
      <rect class="fade-in" style="animation-delay: 1.6s;" x="-15" y="48" width="30" height="2" fill="#ffffff" />
    </g>
  </g>

  <!-- STAT 4: EXPERIENCE -->
  <g transform="translate(875, 90)">
    <g class="stat-block stat-4">
      <text class="font-grotesk" x="0" y="-10" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">1yr</text>
      <text class="font-mono" x="0" y="32" font-size="9" fill="#888888" letter-spacing="2" text-anchor="middle">ACTIVE BUILD</text>
      <rect x="-40" y="48" width="80" height="2" fill="#222222" />
      <rect class="fade-in" style="animation-delay: 1.8s;" x="-25" y="48" width="50" height="2" fill="#ffffff" />
    </g>
  </g>
</svg>
