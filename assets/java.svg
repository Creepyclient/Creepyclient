<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="42" height="42">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Beautiful Steaming Coffee Cup -->
  <g stroke-linecap="round" filter="url(#glow)">
    <!-- Steam Lines (Cyan) -->
    <path d="M55,30 C58,20 50,15 55,8 M68,30 C72,18 64,13 68,8 M80,32 C82,24 76,19 80,12" stroke="#00f0ff" stroke-width="3" fill="none" />
    
    <!-- Coffee Cup (Purple) -->
    <path d="M36,44 L92,44 C92,44 96,68 80,78 C68,86 52,86 48,78 C36,68 36,44 36,44 Z" fill="#7c4dff" stroke="#7c4dff" stroke-width="2" />
    <!-- Cup Handle -->
    <path d="M92,50 C102,50 106,62 92,66" fill="none" stroke="#7c4dff" stroke-width="4.5" />
    
    <!-- Cup Base Plate -->
    <path d="M30,86 L98,86 C104,86 104,92 98,92 L30,92 C24,92 24,86 30,86 Z" fill="#7c4dff" />
  </g>
</svg>
