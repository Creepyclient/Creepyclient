<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      .cup-body {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 350;
        stroke-dashoffset: 350;
        animation: draw-cup 2s ease-out 1.4s forwards;
      }
      .cup-rim {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 80;
        stroke-dashoffset: 80;
        animation: draw-cup 0.6s ease-out 1.2s forwards;
      }
      .steam-1 {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        animation: steam-rise 2.4s ease-in-out 2.5s infinite;
        opacity: 0;
      }
      .steam-2 {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        animation: steam-rise 2.4s ease-in-out 2.8s infinite;
        opacity: 0;
      }
      .steam-3 {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        animation: steam-rise 2.4s ease-in-out 3.1s infinite;
        opacity: 0;
      }
      .saucer {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw-cup 0.7s ease-out 2.8s forwards;
      }

      @keyframes draw-cup {
        to { stroke-dashoffset: 0; }
      }
      @keyframes steam-rise {
        0%   { opacity: 0; transform: translateY(0px) scaleY(1); }
        15%  { opacity: 0.9; }
        70%  { opacity: 0.6; }
        100% { opacity: 0; transform: translateY(-22px) scaleY(1.3); }
      }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- Cup rim (top opening) -->
  <line class="cup-rim" x1="32" y1="52" x2="88" y2="52"/>

  <!-- Cup body (trapezoid) -->
  <path class="cup-body"
    d="M 32 52
       L 38 94
       L 90 94
       L 96 52"/>

  <!-- Cup handle (arc on right side) -->
  <path class="cup-body"
    d="M 92 64
       C 112 64, 112 86, 92 86"
    style="stroke-dasharray:70; stroke-dashoffset:70; animation-delay:2.2s;"/>

  <!-- Java badge / label line inside cup -->
  <line x1="46" y1="74" x2="82" y2="74"
    stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0"
    style="stroke-dasharray:40; stroke-dashoffset:40; animation: draw-cup 0.5s ease-out 2.6s forwards;"/>

  <!-- Saucer (ellipse) -->
  <ellipse class="saucer" cx="64" cy="98" rx="38" ry="6"/>

  <!-- Steam lines with infinite upward drift -->
  <!-- Steam 1 (left) -->
  <path class="steam-1"
    d="M 46 46 C 42 38, 50 32, 46 24"
    style="transform-origin: 46px 35px;"/>
  <!-- Steam 2 (center) -->
  <path class="steam-2"
    d="M 64 44 C 60 36, 68 30, 64 22"
    style="transform-origin: 64px 33px;"/>
  <!-- Steam 3 (right) -->
  <path class="steam-3"
    d="M 82 46 C 78 38, 86 32, 82 24"
    style="transform-origin: 82px 35px;"/>
</svg>
