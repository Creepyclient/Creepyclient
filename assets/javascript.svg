<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');

      .border-path {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: draw-border 2s ease-out 0.2s forwards;
      }
      .js-text {
        font-family: 'Space Grotesk', 'Arial Black', sans-serif;
        font-weight: 700;
        font-size: 36px;
        fill: #ffffff;
        opacity: 0;
        animation: text-appear 0.5s ease-out 1.8s forwards;
      }
      .corner-accent {
        fill: #ffffff;
        opacity: 0;
        animation: corner-pop 0.25s ease-out 2s forwards;
      }
      @keyframes draw-border {
        to { stroke-dashoffset: 0; }
      }
      @keyframes text-appear {
        0% { opacity: 0; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes corner-pop {
        0% { opacity: 0; transform: scale(0); }
        100% { opacity: 1; transform: scale(1); }
      }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- Thin white border square, draws itself -->
  <rect class="border-path" x="14" y="14" width="100" height="100" rx="2"/>

  <!-- Corner accents (small squares at each corner) -->
  <rect class="corner-accent" x="10" y="10" width="8" height="8" style="transform-origin: 14px 14px;"/>
  <rect class="corner-accent" x="110" y="10" width="8" height="8" style="transform-origin: 114px 14px; animation-delay: 2.05s;"/>
  <rect class="corner-accent" x="10" y="110" width="8" height="8" style="transform-origin: 14px 114px; animation-delay: 2.1s;"/>
  <rect class="corner-accent" x="110" y="110" width="8" height="8" style="transform-origin: 114px 114px; animation-delay: 2.15s;"/>

  <!-- 'JS' centered text -->
  <text class="js-text" x="64" y="76" text-anchor="middle" dominant-baseline="middle">JS</text>
</svg>
