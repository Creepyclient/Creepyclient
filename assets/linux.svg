<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="42" height="42">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Beautiful Tux Outline -->
  <g fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tux Body Outline -->
    <path d="M64,15 C52,15 42,25 42,38 C42,42 44,48 40,54 C34,62 26,75 26,88 C26,102 36,110 50,110 L78,110 C92,110 102,102 102,88 C102,75 94,62 88,54 C84,48 86,42 86,38 C86,25 76,15 64,15 Z" />
    <!-- Wings -->
    <path d="M36,60 C24,65 20,80 24,92" />
    <path d="M92,60 C104,65 108,80 104,92" />
    <!-- Belly outline (Inner arch) -->
    <path d="M48,80 C48,65 55,55 64,55 C73,55 80,65 80,80 C80,95 73,105 64,105 C55,105 48,95 48,80 Z" stroke="#7c4dff" />
    <!-- Eyes -->
    <ellipse cx="56" cy="35" rx="3" ry="5" fill="#00f0ff" />
    <ellipse cx="72" cy="35" rx="3" ry="5" fill="#00f0ff" />
    <!-- Beak -->
    <path d="M58,45 L70,45 L64,52 Z" fill="#7c4dff" stroke="#7c4dff" stroke-width="1" />
  </g>
</svg>
