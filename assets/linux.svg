<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      .penguin-body {
        fill: #ffffff;
        opacity: 0;
        animation: build-in 0.4s ease-out forwards;
      }
      .penguin-dark {
        fill: #000000;
        opacity: 0;
        animation: build-in 0.3s ease-out forwards;
      }
      .penguin-outline {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: draw-outline 2s ease-out 0.8s forwards;
      }

      .p0 { animation-delay: 0.8s; }
      .p1 { animation-delay: 1.0s; }
      .p2 { animation-delay: 1.1s; }
      .p3 { animation-delay: 1.2s; }
      .p4 { animation-delay: 1.3s; }
      .p5 { animation-delay: 1.5s; }
      .p6 { animation-delay: 1.6s; }
      .p7 { animation-delay: 1.7s; }

      @keyframes draw-outline {
        to { stroke-dashoffset: 0; }
      }
      @keyframes build-in {
        0% { opacity: 0; transform: scaleY(0); }
        100% { opacity: 1; transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- Penguin body outline draws itself -->
  <!-- Main body (oval) -->
  <path class="penguin-outline"
    d="M 64 20
       C 80 20, 92 30, 94 46
       L 96 58
       C 100 60, 102 66, 100 72
       L 96 80
       C 96 94, 82 106, 64 106
       C 46 106, 32 94, 32 80
       L 28 72
       C 26 66, 28 60, 32 58
       L 34 46
       C 36 30, 48 20, 64 20 Z"/>

  <!-- Belly (inner white oval) -->
  <ellipse class="penguin-body p0" cx="64" cy="72" rx="22" ry="28"
    style="transform-origin: 64px 72px;"/>

  <!-- Head -->
  <circle class="penguin-body p1" cx="64" cy="36" r="20"
    style="transform-origin: 64px 36px;"/>

  <!-- Beak (small triangle, orange→white) -->
  <polygon class="penguin-body p2" points="64,42 59,50 69,50"
    style="transform-origin: 64px 46px;"/>

  <!-- Left eye white -->
  <circle class="penguin-body p3" cx="56" cy="32" r="5"
    style="transform-origin: 56px 32px;"/>
  <!-- Left eye pupil (dark) -->
  <circle class="penguin-dark p3" cx="57" cy="32" r="2.5"
    style="transform-origin: 57px 32px;"/>

  <!-- Right eye white -->
  <circle class="penguin-body p4" cx="72" cy="32" r="5"
    style="transform-origin: 72px 32px;"/>
  <!-- Right eye pupil (dark) -->
  <circle class="penguin-dark p4" cx="73" cy="32" r="2.5"
    style="transform-origin: 73px 32px;"/>

  <!-- Left wing -->
  <ellipse class="penguin-body p5" cx="38" cy="68" rx="10" ry="22"
    transform="rotate(-15, 38, 68)"
    style="transform-origin: 38px 68px;"/>

  <!-- Right wing -->
  <ellipse class="penguin-body p6" cx="90" cy="68" rx="10" ry="22"
    transform="rotate(15, 90, 68)"
    style="transform-origin: 90px 68px;"/>

  <!-- Left foot -->
  <ellipse class="penguin-body p7" cx="52" cy="106" rx="10" ry="5"
    style="transform-origin: 52px 106px;"/>
  <!-- Right foot -->
  <ellipse class="penguin-body p7" cx="76" cy="106" rx="10" ry="5"
    style="transform-origin: 76px 106px; animation-delay: 1.75s;"/>
</svg>
