<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%">
  <defs>
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .grid-lines {
      stroke: #101622;
      stroke-width: 0.8;
    }

    .glowing-node {
      fill: #00f5d4;
      opacity: 0.2;
      animation: breathe-node 4s ease-in-out infinite alternate;
    }

    .glowing-line {
      stroke: url(#grid-glow);
      stroke-width: 1.2;
      fill: none;
    }

    @keyframes breathe-node {
      0% { opacity: 0.1; r: 2px; }
      100% { opacity: 0.6; r: 4px; }
    }
  </style>

  <!-- Static Grid Lines -->
  <g class="grid-lines">
    <!-- Horizontal -->
    <line x1="50" y1="15" x2="950" y2="15" />
    <line x1="50" y1="40" x2="950" y2="40" />
    <line x1="50" y1="65" x2="950" y2="65" />

    <!-- Vertical -->
    <line x1="100" y1="15" x2="100" y2="65" />
    <line x1="200" y1="15" x2="200" y2="65" />
    <line x1="300" y1="15" x2="300" y2="65" />
    <line x1="400" y1="15" x2="400" y2="65" />
    <line x1="500" y1="15" x2="500" y2="65" />
    <line x1="600" y1="15" x2="600" y2="65" />
    <line x1="700" y1="15" x2="700" y2="65" />
    <line x1="800" y1="15" x2="800" y2="65" />
    <line x1="900" y1="15" x2="900" y2="65" />
  </g>

  <!-- Accent glowing horizontal flow line -->
  <path class="glowing-line" d="M 50,40 L 950,40" />

  <!-- Dots at intersections -->
  <circle class="glowing-node" cx="200" cy="40" r="3" />
  <circle class="glowing-node" style="animation-delay: -1.3s;" cx="400" cy="15" r="3" />
  <circle class="glowing-node" style="animation-delay: -2.6s;" cx="600" cy="65" r="3" />
  <circle class="glowing-node" style="animation-delay: -0.7s;" cx="800" cy="40" r="3" />
</svg>
