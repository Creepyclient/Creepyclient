<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-block {
      fill: #101622;
      stroke: #182235;
      stroke-width: 0.8;
    }

    .active-block-1 {
      fill: #00f0ff;
      stroke: #00f0ff;
      filter: url(#glow);
      animation: pulse-block-1 3s ease-in-out infinite alternate;
    }

    .active-block-2 {
      fill: #7c4dff;
      stroke: #7c4dff;
      filter: url(#glow);
      animation: pulse-block-2 4s ease-in-out infinite alternate;
    }

    .matrix-text {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      fill: #4c5d7a;
    }

    @keyframes pulse-block-1 {
      0% { opacity: 0.2; }
      100% { opacity: 0.8; }
    }

    @keyframes pulse-block-2 {
      0% { opacity: 0.1; }
      100% { opacity: 0.7; }
    }
  </style>

  <!-- Row 1 Blocks -->
  <g>
    <rect class="grid-block" x="50" y="20" width="80" height="25" />
    <rect class="grid-block" x="140" y="20" width="80" height="25" />
    <rect class="grid-block active-block-1" x="230" y="20" width="80" height="25" />
    <rect class="grid-block" x="320" y="20" width="80" height="25" />
    <rect class="grid-block" x="410" y="20" width="80" height="25" />
    <rect class="grid-block" x="500" y="20" width="80" height="25" />
    <rect class="grid-block" x="590" y="20" width="80" height="25" />
    <rect class="grid-block active-block-2" x="680" y="20" width="80" height="25" />
    <rect class="grid-block" x="770" y="20" width="80" height="25" />
    <rect class="grid-block" x="860" y="20" width="80" height="25" />
  </g>

  <!-- Row 2 Blocks -->
  <g>
    <rect class="grid-block" x="50" y="55" width="80" height="25" />
    <rect class="grid-block active-block-2" x="140" y="55" width="80" height="25" />
    <rect class="grid-block" x="230" y="55" width="80" height="25" />
    <rect class="grid-block" x="320" y="55" width="80" height="25" />
    <rect class="grid-block active-block-1" x="410" y="55" width="80" height="25" />
    <rect class="grid-block" x="500" y="55" width="80" height="25" />
    <rect class="grid-block" x="590" y="55" width="80" height="25" />
    <rect class="grid-block" x="680" y="55" width="80" height="25" />
    <rect class="grid-block" x="770" y="55" width="80" height="25" />
    <rect class="grid-block active-block-1" x="860" y="55" width="80" height="25" />
  </g>

  <!-- Row 3 Blocks -->
  <g>
    <rect class="grid-block" x="50" y="90" width="80" height="25" />
    <rect class="grid-block" x="140" y="90" width="80" height="25" />
    <rect class="grid-block" x="230" y="90" width="80" height="25" />
    <rect class="grid-block" x="320" y="90" width="80" height="25" />
    <rect class="grid-block" x="410" y="90" width="80" height="25" />
    <rect class="grid-block active-block-2" x="500" y="90" width="80" height="25" />
    <rect class="grid-block" x="590" y="90" width="80" height="25" />
    <rect class="grid-block" x="680" y="90" width="80" height="25" />
    <rect class="grid-block active-block-1" x="770" y="90" width="80" height="25" />
    <rect class="grid-block" x="860" y="90" width="80" height="25" />
  </g>

  <!-- Floating hex values -->
  <text x="65" y="36" class="matrix-text">2F 0A 77</text>
  <text x="155" y="36" class="matrix-text">4D 9B C3</text>
  <text x="335" y="36" class="matrix-text">8E E4 1A</text>
  <text x="515" y="36" class="matrix-text">0F C2 9D</text>
  <text x="785" y="36" class="matrix-text">AA B0 E2</text>

  <text x="245" y="71" class="matrix-text">77 FF D3</text>
  <text x="335" y="71" class="matrix-text">12 40 8B</text>
  <text x="515" y="71" class="matrix-text">BC 34 ED</text>
  <text x="605" y="71" class="matrix-text">8F A2 C1</text>
  <text x="785" y="71" class="matrix-text">FF 09 D7</text>

  <text x="65" y="106" class="matrix-text">C9 B8 A3</text>
  <text x="155" y="106" class="matrix-text">00 F0 FF</text>
  <text x="245" y="106" class="matrix-text">7C 4D FF</text>
  <text x="335" y="106" class="matrix-text">39 FF 14</text>
  <text x="605" y="106" class="matrix-text">E2 C9 D1</text>
  <text x="875" y="106" class="matrix-text">5F 6B 7C</text>
</svg>
