<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030508" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-bg {
      fill: url(#bg-gradient);
    }

    .card-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #ffffff;
      letter-spacing: 2.5px;
    }

    .card-header-line {
      stroke: url(#primary-glow);
      stroke-width: 1;
    }

    .label-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #6b7c96;
      letter-spacing: 0.5px;
    }

    .val-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #00f5d4;
    }

    .bg-bar {
      fill: #101622;
      rx: 2px;
    }

    .fill-bar {
      fill: url(#primary-glow);
      rx: 2px;
      filter: url(#soft-glow);
    }

    .status-dot {
      fill: #00f5d4;
      filter: url(#soft-glow);
      animation: pulse-dot 2s ease-in-out infinite alternate;
    }

    .divider-dash {
      stroke: #121a24;
      stroke-width: 1;
      stroke-dasharray: 4 6;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.4; r: 3.5px; }
      100% { opacity: 1; r: 5px; }
    }

    .bar-1 { animation: loadBar1 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
    .bar-2 { animation: loadBar2 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
    .bar-3 { animation: loadBar3 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }

    @keyframes loadBar1 { from { width: 0; } to { width: 210px; } }
    @keyframes loadBar2 { from { width: 0; } to { width: 195px; } }
    @keyframes loadBar3 { from { width: 0; } to { width: 205px; } }
  </style>

  <!-- Background Card -->
  <rect class="card-bg" width="1000" height="280" rx="10" stroke="#121a24" stroke-width="1.5" />

  <!-- Grid separators -->
  <g class="divider-dash">
    <line x1="340" y1="30" x2="340" y2="250" />
    <line x1="660" y1="30" x2="660" y2="250" />
  </g>

  <!-- Column 1: Core Specialization -->
  <g transform="translate(40, 45)">
    <text x="0" y="10" class="card-title">CORE DISCIPLINE</text>
    <line x1="0" y1="20" x2="260" y2="20" class="card-header-line" />
    
    <g transform="translate(0, 50)">
      <text x="0" y="10" class="label-text">Frontend Systems</text>
      <text x="180" y="10" class="val-text">Vite / Next.js</text>
      
      <text x="0" y="45" class="label-text">Backend Design</text>
      <text x="180" y="45" class="val-text">REST / WebSockets</text>

      <text x="0" y="80" class="label-text">Architecture Focus</text>
      <text x="180" y="80" class="val-text">Clean Code / SOLID</text>

      <text x="0" y="115" class="label-text">Cloud Deployment</text>
      <text x="180" y="115" class="val-text">Docker / Vercel</text>
      
      <text x="0" y="150" class="label-text">Quality Standards</text>
      <text x="180" y="150" class="val-text">Optimized</text>
    </g>
  </g>

  <!-- Column 2: System Metrics -->
  <g transform="translate(380, 45)">
    <text x="0" y="10" class="card-title">PERFORMANCE METRICS</text>
    <line x1="0" y1="20" x2="240" y2="20" class="card-header-line" />

    <g transform="translate(0, 50)">
      <text x="0" y="10" class="label-text">Runtime Performance</text>
      <text x="205" y="10" class="val-text">98%</text>
      <rect x="0" y="22" width="220" height="4" class="bg-bar" />
      <rect x="0" y="22" width="210" height="4" class="fill-bar bar-1" />

      <text x="0" y="65" class="label-text">Modular Decoupling</text>
      <text x="205" y="65" class="val-text">92%</text>
      <rect x="0" y="77" width="220" height="4" class="bg-bar" />
      <rect x="0" y="77" width="195" height="4" class="fill-bar bar-2" />

      <text x="0" y="120" class="label-text">Resource Utilization</text>
      <text x="205" y="120" class="val-text">96%</text>
      <rect x="0" y="132" width="220" height="4" class="bg-bar" />
      <rect x="0" y="132" width="205" height="4" class="fill-bar bar-3" />
    </g>
  </g>

  <!-- Column 3: Platform Telemetry -->
  <g transform="translate(700, 45)">
    <text x="0" y="10" class="card-title">INFRASTRUCTURE STATUS</text>
    <line x1="0" y1="20" x2="260" y2="20" class="card-header-line" />

    <g transform="translate(0, 50)">
      <text x="0" y="10" class="label-text">Deployment Env</text>
      <circle class="status-dot" cx="195" cy="5" r="4.5" />
      <text x="210" y="10" class="val-text" fill="#00f5d4">Active</text>

      <text x="0" y="45" class="label-text">Service Uptime</text>
      <text x="180" y="45" class="val-text">99.98%</text>

      <text x="0" y="80" class="label-text">Build Pipeline</text>
      <text x="180" y="80" class="val-text" fill="#00f5d4">Passing</text>

      <text x="0" y="115" class="label-text">Sync Status</text>
      <text x="180" y="115" class="val-text">Completed</text>
      
      <text x="0" y="150" class="label-text">Target Platform</text>
      <text x="180" y="150" class="val-text">Production</text>
    </g>
  </g>
</svg>
