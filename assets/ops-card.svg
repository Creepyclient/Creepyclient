<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0c101b" />
    </linearGradient>

    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-title {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #ffffff;
      letter-spacing: 2px;
    }

    .card-header-line {
      stroke: url(#cyan-purple);
      stroke-width: 1.5;
    }

    .label-text {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #8b9bb4;
      letter-spacing: 1px;
    }

    .val-text {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 13px;
      fill: #00f0ff;
    }

    .bg-bar {
      fill: #141b2d;
      rx: 3px;
    }

    .fill-bar {
      fill: url(#cyan-purple);
      rx: 3px;
      filter: url(#neon-glow);
    }

    .green-dot {
      fill: #39ff14;
      filter: url(#neon-glow);
      animation: pulse-green 1.8s ease-in-out infinite alternate;
    }

    .grid-lines {
      stroke: #121b2d;
      stroke-width: 0.8;
      stroke-dasharray: 2 4;
    }

    @keyframes pulse-green {
      0% { opacity: 0.4; r: 3.5px; }
      100% { opacity: 1; r: 5.5px; }
    }

    .bar-animate-1 { animation: loadBar1 3s ease-out forwards; }
    .bar-animate-2 { animation: loadBar2 3s ease-out forwards; }
    .bar-animate-3 { animation: loadBar3 3s ease-out forwards; }

    @keyframes loadBar1 { from { width: 0; } to { width: 220px; } }
    @keyframes loadBar2 { from { width: 0; } to { width: 205px; } }
    @keyframes loadBar3 { from { width: 0; } to { width: 215px; } }
  </style>

  <!-- Background -->
  <rect width="1000" height="280" rx="10" fill="url(#bg-grad)" stroke="#121b2d" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g class="grid-lines">
    <line x1="333" y1="20" x2="333" y2="260" />
    <line x1="666" y1="20" x2="666" y2="260" />
  </g>

  <!-- COLUMN 1: ARCHITECTURE PILLARS -->
  <g transform="translate(40, 40)">
    <text x="0" y="10" class="card-title">ENGINEERING FOCUS</text>
    <line x1="0" y1="20" x2="250" y2="20" class="card-header-line" />
    
    <g transform="translate(0, 50)">
      <!-- System Architecture -->
      <text x="0" y="10" class="label-text">Frontend Architecture</text>
      <text x="210" y="10" class="val-text">VITE / NEXT.JS</text>
      
      <!-- Backend Scalability -->
      <text x="0" y="45" class="label-text">Backend Design</text>
      <text x="210" y="45" class="val-text">SCALABLE REST/WS</text>

      <!-- Security First -->
      <text x="0" y="80" class="label-text">System Performance</text>
      <text x="210" y="80" class="val-text">OPTIMIZED</text>

      <!-- Code Integrity -->
      <text x="0" y="115" class="label-text">Clean Code Practice</text>
      <text x="210" y="115" class="val-text">SOLID / DRY</text>
      
      <!-- Infrastructure -->
      <text x="0" y="150" class="label-text">Cloud &amp; Containers</text>
      <text x="210" y="150" class="val-text">DOCKER / VERCEL</text>
    </g>
  </g>

  <!-- COLUMN 2: SYSTEM OPTIMIZATION STATUS -->
  <g transform="translate(373, 40)">
    <text x="0" y="10" class="card-title">OPTIMIZATION METRICS</text>
    <line x1="0" y1="20" x2="250" y2="20" class="card-header-line" />

    <g transform="translate(0, 50)">
      <!-- Metric 1 -->
      <text x="0" y="10" class="label-text">Core Performance Velocity</text>
      <text x="215" y="10" class="val-text">98%</text>
      <rect x="0" y="20" width="230" height="6" class="bg-bar" />
      <rect x="0" y="20" width="220" height="6" class="fill-bar bar-animate-1" />

      <!-- Metric 2 -->
      <text x="0" y="60" class="label-text">Architectural Decoupling</text>
      <text x="215" y="60" class="val-text">92%</text>
      <rect x="0" y="70" width="230" height="6" class="bg-bar" />
      <rect x="0" y="70" width="205" height="6" class="fill-bar bar-animate-2" />

      <!-- Metric 3 -->
      <text x="0" y="110" class="label-text">Resource Utilization</text>
      <text x="215" y="110" class="val-text">96%</text>
      <rect x="0" y="120" width="230" height="6" class="bg-bar" />
      <rect x="0" y="120" width="215" height="6" class="fill-bar bar-animate-3" />
    </g>
  </g>

  <!-- COLUMN 3: PLATFORM STATUS -->
  <g transform="translate(706, 40)">
    <text x="0" y="10" class="card-title">PLATFORM STATUS</text>
    <line x1="0" y1="20" x2="250" y2="20" class="card-header-line" />

    <g transform="translate(0, 50)">
      <!-- Environment Status -->
      <text x="0" y="10" class="label-text">Deployment Env</text>
      <circle class="green-dot" cx="210" cy="5" r="4.5" />
      <text x="225" y="10" class="val-text" fill="#39ff14">UP</text>

      <!-- System Uptime -->
      <text x="0" y="45" class="label-text">System Uptime</text>
      <text x="180" y="45" class="val-text">99.98%</text>

      <!-- Build Pipeline -->
      <text x="0" y="80" class="label-text">Build Pipeline</text>
      <text x="180" y="80" class="val-text" fill="#39ff14">PASSING</text>

      <!-- Version Control -->
      <text x="0" y="115" class="label-text">Branch Status</text>
      <text x="180" y="115" class="val-text">SYNCED</text>
      
      <!-- Tech stack signature -->
      <text x="0" y="150" class="label-text">Target Platform</text>
      <text x="180" y="150" class="val-text">PRODUCTION</text>
    </g>
  </g>

</svg>
