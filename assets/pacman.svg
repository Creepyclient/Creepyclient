<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .maze-wall {
      stroke: #172237;
      stroke-width: 3;
      fill: none;
    }

    .maze-wall-glow {
      stroke: #7c4dff;
      stroke-width: 5;
      fill: none;
      filter: url(#glow);
      opacity: 0.5;
    }

    .pacman {
      fill: #ffd43b;
      filter: url(#glow);
    }

    .ghost {
      fill: #00f0ff;
      filter: url(#glow);
    }

    .ghost-eye {
      fill: #ffffff;
    }

    .ghost-pupil {
      fill: #0c101b;
    }

    .dot {
      fill: #ffffff;
      filter: url(#glow);
      animation: flash-dot 1.5s ease-in-out infinite alternate;
    }

    /* Pacman mouth animation using clipPath or path morphing */
    .pacman-mouth {
      animation: chomp 0.5s step-start infinite;
    }

    /* Pacman movement across maze */
    .sprite-group {
      animation: walk 16s linear infinite;
    }

    @keyframes flash-dot {
      0% { opacity: 0.3; r: 2px; }
      100% { opacity: 1; r: 4px; }
    }

    @keyframes walk {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(1100px); }
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="140" rx="10" fill="#07090e" stroke="#121b2d" stroke-width="1.5" />

  <!-- Maze Walls -->
  <path class="maze-wall-glow" d="M 30,25 L 970,25 M 30,115 L 970,115 M 500,25 L 500,55 M 250,85 L 250,115 M 750,85 L 750,115" />
  <path class="maze-wall" d="M 30,25 L 970,25 M 30,115 L 970,115 M 500,25 L 500,55 M 250,85 L 250,115 M 750,85 L 750,115" />

  <!-- Stationary Dots that disappear (or just pulsate) -->
  <circle class="dot" cx="100" cy="70" r="3.5" />
  <circle class="dot" cx="200" cy="70" r="3.5" />
  <circle class="dot" cx="300" cy="70" r="3.5" />
  <circle class="dot" cx="400" cy="70" r="3.5" />
  <circle class="dot" cx="500" cy="70" r="3.5" />
  <circle class="dot" cx="600" cy="70" r="3.5" />
  <circle class="dot" cx="700" cy="70" r="3.5" />
  <circle class="dot" cx="800" cy="70" r="3.5" />
  <circle class="dot" cx="900" cy="70" r="3.5" />

  <!-- Moving Character Group -->
  <g class="sprite-group">
    <!-- Ghost (Blinky / Inky styled) -->
    <g class="ghost" transform="translate(0, 50)">
      <!-- Ghost body path -->
      <path d="M 10,20 C 10,5 30,5 30,20 L 30,35 L 26,32 L 22,35 L 18,32 L 14,35 L 10,32 Z" />
      <!-- Eyes -->
      <circle class="ghost-eye" cx="16" cy="15" r="3" />
      <circle class="ghost-eye" cx="24" cy="15" r="3" />
      <!-- Pupils looking right -->
      <circle class="ghost-pupil" cx="17" cy="15" r="1.2" />
      <circle class="ghost-pupil" cx="25" cy="15" r="1.2" />
    </g>

    <!-- Pacman -->
    <g class="pacman" transform="translate(60, 50)">
      <!-- Pacman base shape with mouth cut out -->
      <path d="M 20,20 A 15,15 0 1,0 20,20.1 Z" />
      <!-- Eye -->
      <circle cx="20" cy="12" r="1.5" fill="#000" />
    </g>
  </g>
</svg>
