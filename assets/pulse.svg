<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%">
  <defs>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf" />
      <stop offset="50%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
  </defs>

  <style>
    .conn-path {
      stroke: #101826;
      stroke-width: 1.5;
      fill: none;
    }

    .active-flow {
      stroke: url(#line-gradient);
      stroke-width: 2;
      fill: none;
      filter: url(#soft-glow);
      stroke-dasharray: 40 160;
      animation: signal-flow 5s linear infinite;
    }

    .node-base {
      fill: #060910;
      stroke: #1b2639;
      stroke-width: 1.5;
    }

    .node-active {
      fill: #00f5d4;
      stroke: #00f5d4;
      stroke-width: 1;
      filter: url(#soft-glow);
      animation: pulse-active 2.5s ease-in-out infinite alternate;
    }

    @keyframes signal-flow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulse-active {
      0% { r: 3px; opacity: 0.5; }
      100% { r: 5px; opacity: 1; }
    }
  </style>

  <!-- Connection Paths -->
  <path class="conn-path" d="M 80,50 L 250,50 L 350,20 L 650,20 L 750,50 L 920,50" />
  <path class="conn-path" d="M 250,50 L 350,80 L 650,80 L 750,50" />

  <!-- Flow Animations -->
  <path class="active-flow" d="M 80,50 L 250,50 L 350,20 L 650,20 L 750,50 L 920,50" />
  <path class="active-flow" style="animation-delay: -2.5s;" d="M 250,50 L 350,80 L 650,80 L 750,50" />

  <!-- Node Dots -->
  <circle class="node-base" cx="80" cy="50" r="4.5" />
  <circle class="node-base" cx="250" cy="50" r="4.5" />
  <circle class="node-base" cx="350" cy="20" r="4.5" />
  <circle class="node-base" cx="650" cy="20" r="4.5" />
  <circle class="node-base" cx="350" cy="80" r="4.5" />
  <circle class="node-base" cx="650" cy="80" r="4.5" />
  <circle class="node-base" cx="750" cy="50" r="4.5" />
  <circle class="node-base" cx="920" cy="50" r="4.5" />

  <!-- Glowing Nodes -->
  <circle class="node-active" cx="250" cy="50" r="3.5" />
  <circle class="node-active" style="animation-delay: -0.8s;" cx="750" cy="50" r="3.5" />
</svg>
