<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      .ellipse-1 {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-dasharray: 310;
        stroke-dashoffset: 310;
        animation: draw-ellipse 2s ease-out 0.4s forwards;
      }
      .ellipse-2 {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-dasharray: 310;
        stroke-dashoffset: 310;
        animation: draw-ellipse 2s ease-out 0.7s forwards;
      }
      .ellipse-3 {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.5;
        stroke-dasharray: 310;
        stroke-dashoffset: 310;
        animation: draw-ellipse 2s ease-out 1.0s forwards;
      }
      .center-dot {
        fill: #ffffff;
        opacity: 0;
        animation: dot-pop 0.4s cubic-bezier(0.34,1.56,0.64,1) 1.8s forwards;
      }
      .orbit-dot {
        fill: #ffffff;
        opacity: 0;
        animation: dot-pop 0.3s cubic-bezier(0.34,1.56,0.64,1) 2.0s forwards;
      }
      @keyframes draw-ellipse {
        to { stroke-dashoffset: 0; }
      }
      @keyframes dot-pop {
        0% { opacity: 0; r: 0; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- Ellipse 1: 0° rotation (horizontal) -->
  <ellipse class="ellipse-1" cx="64" cy="64" rx="52" ry="18"
    transform="rotate(0, 64, 64)"/>

  <!-- Ellipse 2: 60° rotation -->
  <ellipse class="ellipse-2" cx="64" cy="64" rx="52" ry="18"
    transform="rotate(60, 64, 64)"/>

  <!-- Ellipse 3: 120° rotation -->
  <ellipse class="ellipse-3" cx="64" cy="64" rx="52" ry="18"
    transform="rotate(120, 64, 64)"/>

  <!-- Electron dots on orbits -->
  <circle class="orbit-dot" cx="116" cy="64" r="4" style="animation-delay:2.05s;"/>
  <circle class="orbit-dot" cx="38" cy="17.6" r="4" style="animation-delay:2.1s;"/>
  <circle class="orbit-dot" cx="38" cy="110.4" r="4" style="animation-delay:2.15s;"/>

  <!-- Center nucleus dot -->
  <circle class="center-dot" cx="64" cy="64" r="7"/>
</svg>
