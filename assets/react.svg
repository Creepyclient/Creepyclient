<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="42" height="42">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow)">
    <!-- Orbit Ellipses -->
    <ellipse cx="64" cy="64" rx="20" ry="54" transform="rotate(30 64 64)" />
    <ellipse cx="64" cy="64" rx="20" ry="54" transform="rotate(90 64 64)" />
    <ellipse cx="64" cy="64" rx="20" ry="54" transform="rotate(150 64 64)" />
  </g>
  <!-- Nucleus -->
  <circle cx="64" cy="64" r="8" fill="#7c4dff" filter="url(#glow)" />
</svg>
