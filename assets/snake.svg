<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <defs>
    <style>
      /* Grid lines */
      .grid-line {
        stroke: #ffffff;
        stroke-width: 0.6;
        opacity: 0.18;
      }

      /* Snake body: S-path crawl via stroke-dashoffset */
      @keyframes snake-crawl {
        0%   { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }

      /* Snake head bob */
      @keyframes head-pulse {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.15); }
      }

      /* Food items pulse */
      @keyframes food-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.7; transform: scale(0.85); }
      }

      /* Food eaten: blink out at specific loop times */
      @keyframes food-glow {
        0%, 100% { box-shadow: none; opacity: 1; }
        50%       { opacity: 0.5; }
      }

      .snake-body {
        fill: none;
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: snake-crawl 10s linear 1.6s infinite;
      }

      .snake-head {
        fill: #ffffff;
        transform-origin: 940px 60px;
        animation: head-pulse 0.5s ease-in-out 1.6s infinite;
      }

      .food {
        fill: #ffffff;
        animation: food-pulse 1.8s ease-in-out infinite;
      }
      .food-1 { animation-delay: 0.2s; transform-origin: 200px 60px; }
      .food-2 { animation-delay: 0.9s; transform-origin: 500px 80px; }
      .food-3 { animation-delay: 1.5s; transform-origin: 760px 40px; }
    </style>
  </defs>

  <!-- Black background -->
  <rect width="1000" height="120" fill="#000000"/>

  <!-- Subtle white grid: vertical lines every 20px -->
  <g>
    <!-- 50 vertical lines from x=0 to x=1000 every 20px -->
    <line class="grid-line" x1="20"  y1="0" x2="20"  y2="120"/>
    <line class="grid-line" x1="40"  y1="0" x2="40"  y2="120"/>
    <line class="grid-line" x1="60"  y1="0" x2="60"  y2="120"/>
    <line class="grid-line" x1="80"  y1="0" x2="80"  y2="120"/>
    <line class="grid-line" x1="100" y1="0" x2="100" y2="120"/>
    <line class="grid-line" x1="120" y1="0" x2="120" y2="120"/>
    <line class="grid-line" x1="140" y1="0" x2="140" y2="120"/>
    <line class="grid-line" x1="160" y1="0" x2="160" y2="120"/>
    <line class="grid-line" x1="180" y1="0" x2="180" y2="120"/>
    <line class="grid-line" x1="200" y1="0" x2="200" y2="120"/>
    <line class="grid-line" x1="220" y1="0" x2="220" y2="120"/>
    <line class="grid-line" x1="240" y1="0" x2="240" y2="120"/>
    <line class="grid-line" x1="260" y1="0" x2="260" y2="120"/>
    <line class="grid-line" x1="280" y1="0" x2="280" y2="120"/>
    <line class="grid-line" x1="300" y1="0" x2="300" y2="120"/>
    <line class="grid-line" x1="320" y1="0" x2="320" y2="120"/>
    <line class="grid-line" x1="340" y1="0" x2="340" y2="120"/>
    <line class="grid-line" x1="360" y1="0" x2="360" y2="120"/>
    <line class="grid-line" x1="380" y1="0" x2="380" y2="120"/>
    <line class="grid-line" x1="400" y1="0" x2="400" y2="120"/>
    <line class="grid-line" x1="420" y1="0" x2="420" y2="120"/>
    <line class="grid-line" x1="440" y1="0" x2="440" y2="120"/>
    <line class="grid-line" x1="460" y1="0" x2="460" y2="120"/>
    <line class="grid-line" x1="480" y1="0" x2="480" y2="120"/>
    <line class="grid-line" x1="500" y1="0" x2="500" y2="120"/>
    <line class="grid-line" x1="520" y1="0" x2="520" y2="120"/>
    <line class="grid-line" x1="540" y1="0" x2="540" y2="120"/>
    <line class="grid-line" x1="560" y1="0" x2="560" y2="120"/>
    <line class="grid-line" x1="580" y1="0" x2="580" y2="120"/>
    <line class="grid-line" x1="600" y1="0" x2="600" y2="120"/>
    <line class="grid-line" x1="620" y1="0" x2="620" y2="120"/>
    <line class="grid-line" x1="640" y1="0" x2="640" y2="120"/>
    <line class="grid-line" x1="660" y1="0" x2="660" y2="120"/>
    <line class="grid-line" x1="680" y1="0" x2="680" y2="120"/>
    <line class="grid-line" x1="700" y1="0" x2="700" y2="120"/>
    <line class="grid-line" x1="720" y1="0" x2="720" y2="120"/>
    <line class="grid-line" x1="740" y1="0" x2="740" y2="120"/>
    <line class="grid-line" x1="760" y1="0" x2="760" y2="120"/>
    <line class="grid-line" x1="780" y1="0" x2="780" y2="120"/>
    <line class="grid-line" x1="800" y1="0" x2="800" y2="120"/>
    <line class="grid-line" x1="820" y1="0" x2="820" y2="120"/>
    <line class="grid-line" x1="840" y1="0" x2="840" y2="120"/>
    <line class="grid-line" x1="860" y1="0" x2="860" y2="120"/>
    <line class="grid-line" x1="880" y1="0" x2="880" y2="120"/>
    <line class="grid-line" x1="900" y1="0" x2="900" y2="120"/>
    <line class="grid-line" x1="920" y1="0" x2="920" y2="120"/>
    <line class="grid-line" x1="940" y1="0" x2="940" y2="120"/>
    <line class="grid-line" x1="960" y1="0" x2="960" y2="120"/>
    <line class="grid-line" x1="980" y1="0" x2="980" y2="120"/>

    <!-- Horizontal lines every 20px: y=20,40,60,80,100 -->
    <line class="grid-line" x1="0" y1="20"  x2="1000" y2="20"/>
    <line class="grid-line" x1="0" y1="40"  x2="1000" y2="40"/>
    <line class="grid-line" x1="0" y1="60"  x2="1000" y2="60"/>
    <line class="grid-line" x1="0" y1="80"  x2="1000" y2="80"/>
    <line class="grid-line" x1="0" y1="100" x2="1000" y2="100"/>
  </g>

  <!-- 3 food items (white filled squares, 8x8) -->
  <rect class="food food-1" x="196" y="56" width="8" height="8"/>
  <rect class="food food-2" x="496" y="76" width="8" height="8"/>
  <rect class="food food-3" x="756" y="36" width="8" height="8"/>

  <!--
    Snake S-pattern path:
    Starts at left (x=60), crawls right in an S-curve shape.
    Waypoints snap to 20px grid:
    (60,60) → (60,40) → (200,40) → (200,80) → (400,80) → (400,40) → (560,40) → (560,80) → (760,80) → (760,40) → (940,40) → (940,60)
  -->
  <polyline class="snake-body"
    points="
      60,60
      60,40
      200,40
      200,80
      400,80
      400,40
      560,40
      560,80
      760,80
      760,40
      940,40
      940,60
    "/>

  <!-- Snake head (slightly larger square at the leading point, x=940, y=60) -->
  <rect class="snake-head" x="932" y="52" width="16" height="16"/>
  <!-- Snake eyes (two tiny black dots) -->
  <circle fill="#000000" cx="937" cy="57" r="2"
    style="animation: head-pulse 0.5s ease-in-out 1.6s infinite; transform-origin: 940px 60px;"/>
  <circle fill="#000000" cx="945" cy="57" r="2"
    style="animation: head-pulse 0.5s ease-in-out 1.6s infinite; transform-origin: 940px 60px;"/>
</svg>
