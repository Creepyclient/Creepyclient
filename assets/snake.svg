<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-lines {
      stroke: #121b2d;
      stroke-width: 0.5;
    }

    .snake-body {
      fill: none;
      stroke: #39ff14;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#glow);
      stroke-dasharray: 800;
      stroke-dashoffset: 0;
      animation: snake-crawl 10s linear infinite;
    }

    .snake-head {
      fill: #00f0ff;
      filter: url(#glow);
    }

    .snake-eye {
      fill: #0c101b;
    }

    .food {
      fill: #7c4dff;
      filter: url(#glow);
      animation: pulse-food 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-food {
      0% { r: 4px; opacity: 0.5; }
      100% { r: 6.5px; opacity: 1; }
    }

    @keyframes snake-crawl {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="140" rx="10" fill="#07090e" stroke="#121b2d" stroke-width="1.5" />

  <!-- Playfield Grid Overlay -->
  <g class="grid-lines">
    <!-- Horizontal -->
    <line x1="0" y1="20" x2="1000" y2="20" />
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="120" x2="1000" y2="120" />

    <!-- Vertical (subset) -->
    <line x1="100" y1="0" x2="100" y2="140" />
    <line x1="200" y1="0" x2="200" y2="140" />
    <line x1="300" y1="0" x2="300" y2="140" />
    <line x1="400" y1="0" x2="400" y2="140" />
    <line x1="500" y1="0" x2="500" y2="140" />
    <line x1="600" y1="0" x2="600" y2="140" />
    <line x1="700" y1="0" x2="700" y2="140" />
    <line x1="800" y1="0" x2="800" y2="140" />
    <line x1="900" y1="0" x2="900" y2="140" />
  </g>

  <!-- Snake Path crawling across grid -->
  <!-- Let's define a path that snakes around -->
  <path class="snake-body" d="M 50,70 L 250,70 L 250,30 L 450,30 L 450,110 L 650,110 L 650,50 L 850,50" />

  <!-- Animated Snake Head -->
  <!-- Let's place it at the end of the path (x=850, y=50) -->
  <g class="snake-head" transform="translate(845, 45)">
    <rect width="10" height="10" rx="2" />
    <!-- Tongue -->
    <path d="M 10,5 L 14,3 L 14,7 Z" fill="#ffd43b" />
    <!-- Eyes -->
    <circle class="snake-eye" cx="7" cy="3" r="1.5" />
    <circle class="snake-eye" cx="7" cy="7" r="1.5" />
  </g>

  <!-- Foods -->
  <circle class="food" cx="900" cy="50" r="5" />
  <circle class="food" cx="300" cy="30" r="5" />
  <circle class="food" cx="500" cy="110" r="5" />
</svg>
