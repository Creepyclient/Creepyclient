<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" fill="none" width="100%">
  <defs>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b2cbf" stop-opacity="0" />
      <stop offset="30%" stop-color="#7b2cbf" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="1" />
      <stop offset="70%" stop-color="#7b2cbf" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0" />
    </linearGradient>
    
    <filter id="soft-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .refined-wave {
      stroke: url(#wave-gradient);
      stroke-width: 1.5;
      filter: url(#soft-glow);
      animation: wave-breathe 6s ease-in-out infinite alternate;
    }

    @keyframes wave-breathe {
      0% { transform: scaleY(0.8) translateY(5px); }
      100% { transform: scaleY(1.1) translateY(-5px); }
    }
  </style>

  <!-- Elegant Single Sine Path -->
  <path class="refined-wave" d="M 0,30 Q 125,5 250,30 T 500,30 T 750,30 T 1000,30" />
</svg>
