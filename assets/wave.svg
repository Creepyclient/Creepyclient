<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" fill="none" width="100%">
  <defs>
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0" />
      <stop offset="50%" stop-color="#7c4dff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .wave-line {
      stroke-width: 1.5;
      filter: url(#glow);
    }
    
    .w1 {
      stroke: url(#wave-grad-1);
      animation: shift-wave-1 8s linear infinite;
    }
    
    .w2 {
      stroke: url(#wave-grad-2);
      animation: shift-wave-2 12s linear infinite;
      stroke-width: 1;
    }

    @keyframes shift-wave-1 {
      0% { transform: translateX(0) scaleY(1); }
      50% { transform: translateX(-50px) scaleY(1.2); }
      100% { transform: translateX(0) scaleY(1); }
    }

    @keyframes shift-wave-2 {
      0% { transform: translateX(0) scaleY(1); }
      50% { transform: translateX(50px) scaleY(0.8); }
      100% { transform: translateX(0) scaleY(1); }
    }
  </style>

  <!-- Wave 1 Path -->
  <path class="wave-line w1" d="M 0,50 Q 125,20 250,50 T 500,50 T 750,50 T 1000,50" />
  
  <!-- Wave 2 Path -->
  <path class="wave-line w2" d="M 0,50 Q 125,80 250,50 T 500,50 T 750,50 T 1000,50" />
</svg>
