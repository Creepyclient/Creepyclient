<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" style="display:block;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&amp;family=JetBrains+Mono:wght@300;400;700&amp;display=swap');

      .wave-primary {
        fill: none;
        stroke: #ffffff;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 3200;
        stroke-dashoffset: 3200;
        animation:
          drawWave 5s cubic-bezier(0.77, 0, 0.175, 1) forwards,
          breatheY 5s ease-in-out 5s infinite;
        transform-origin: 500px 40px;
      }
      @keyframes drawWave {
        0%   { stroke-dashoffset: 3200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes breatheY {
        0%   { transform: scaleY(0.5); }
        50%  { transform: scaleY(1.2); }
        100% { transform: scaleY(0.5); }
      }

      .wave-secondary {
        fill: none;
        stroke: #ffffff;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.3;
        stroke-dasharray: 3200;
        stroke-dashoffset: 3200;
        animation:
          drawWave2 5s cubic-bezier(0.77, 0, 0.175, 1) 0.6s forwards,
          breatheY2 5s ease-in-out 5s infinite;
        transform-origin: 500px 40px;
      }
      @keyframes drawWave2 {
        0%   { stroke-dashoffset: 3200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes breatheY2 {
        0%   { transform: scaleY(0.6) translateX(8px); }
        50%  { transform: scaleY(1.15) translateX(8px); }
        100% { transform: scaleY(0.6) translateX(8px); }
      }

      .scan-line {
        stroke: #ffffff;
        stroke-width: 0.5;
        stroke-dasharray: 2 6;
        opacity: 0.12;
        animation: scanFade 3s ease forwards;
        animation-delay: 4.5s;
      }
      @keyframes scanFade {
        0%   { opacity: 0; }
        100% { opacity: 0.12; }
      }

      .corner-mark {
        fill: none;
        stroke: #ffffff;
        stroke-width: 0.8;
        opacity: 0;
        animation: fadeIn 0.5s ease forwards;
      }
      @keyframes fadeIn {
        to { opacity: 0.4; }
      }

      .label {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 7px;
        fill: #888888;
        letter-spacing: 1px;
        opacity: 0;
        animation: fadeIn 0.8s ease 4.5s forwards;
      }
    </style>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="1000" height="80" fill="#000000"/>

  <!-- Subtle horizontal grid lines -->
  <line class="scan-line" x1="0" y1="20" x2="1000" y2="20" animation-delay="4.6s"/>
  <line class="scan-line" x1="0" y1="40" x2="1000" y2="40" animation-delay="4.7s"/>
  <line class="scan-line" x1="0" y1="60" x2="1000" y2="60" animation-delay="4.8s"/>

  <!-- Subtle vertical grid lines -->
  <line class="scan-line" x1="200" y1="0" x2="200" y2="80" animation-delay="4.65s"/>
  <line class="scan-line" x1="400" y1="0" x2="400" y2="80" animation-delay="4.75s"/>
  <line class="scan-line" x1="600" y1="0" x2="600" y2="80" animation-delay="4.85s"/>
  <line class="scan-line" x1="800" y1="0" x2="800" y2="80" animation-delay="4.95s"/>

  <!-- Corner bracket marks -->
  <path class="corner-mark" d="M8,12 L8,4 L16,4" animation-delay="4.5s"/>
  <path class="corner-mark" d="M992,12 L992,4 L984,4" animation-delay="4.5s"/>
  <path class="corner-mark" d="M8,68 L8,76 L16,76" animation-delay="4.5s"/>
  <path class="corner-mark" d="M992,68 L992,76 L984,76" animation-delay="4.5s"/>

