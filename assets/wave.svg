  <!-- Primary sine wave -->
  <path class="wave-primary" filter="url(#waveGlow)"
    d="M0,40 C4.36,40 8.73,51.69 13.09,62.28 C17.45,72.87 21.82,79.99 26.18,79.99 C30.55,79.99 34.91,72.86 39.27,62.27 C43.64,51.68 48,40 52.36,40 C56.73,40 61.09,28.32 65.45,17.73 C69.82,7.14 74.18,0.01 78.55,0.01 C82.91,0.01 87.27,7.13 91.64,17.72 C96,28.31 100.36,40 104.73,40 C109.09,40 113.45,51.69 117.82,62.28 C122.18,72.87 126.55,79.99 130.91,79.99 C135.27,79.99 139.64,72.86 144,62.27 C148.36,51.68 152.73,40 157.09,40 C161.45,40 165.82,28.32 170.18,17.73 C174.55,7.14 178.91,0.01 183.27,0.01 C187.64,0.01 192,7.13 196.36,17.72 C200.73,28.31 205.09,40 209.45,40 C213.82,40 218.18,51.69 222.55,62.28 C226.91,72.87 231.27,79.99 235.64,79.99 C240,79.99 244.36,72.86 248.73,62.27 C253.09,51.68 257.45,40 261.82,40 C266.18,40 270.55,28.32 274.91,17.73 C279.27,7.14 283.64,0.01 288,0.01 C292.36,0.01 296.73,7.13 301.09,17.72 C305.45,28.31 309.82,40 314.18,40 C318.55,40 322.91,51.69 327.27,62.28 C331.64,72.87 336,79.99 340.36,79.99 C344.73,79.99 349.09,72.86 353.45,62.27 C357.82,51.68 362.18,40 366.55,40 C370.91,40 375.27,28.32 379.64,17.73 C384,7.14 388.36,0.01 392.73,0.01 C397.09,0.01 401.45,7.13 405.82,17.72 C410.18,28.31 414.55,40 418.91,40 C423.27,40 427.64,51.69 432,62.28 C436.36,72.87 440.73,79.99 445.09,79.99 C449.45,79.99 453.82,72.86 458.18,62.27 C462.55,51.68 466.91,40 471.27,40 C475.64,40 480,28.32 484.36,17.73 C488.73,7.14 493.09,0.01 497.45,0.01 C501.82,0.01 506.18,7.13 510.55,17.72 C514.91,28.31 519.27,40 523.64,40 C528,40 532.36,51.69 536.73,62.28 C541.09,72.87 545.45,79.99 549.82,79.99 C554.18,79.99 558.55,72.86 562.91,62.27 C567.27,51.68 571.64,40 576,40 C580.36,40 584.73,28.32 589.09,17.73 C593.45,7.14 597.82,0.01 602.18,0.01 C606.55,0.01 610.91,7.13 615.27,17.72 C619.64,28.31 624,40 628.36,40 C632.73,40 637.09,51.69 641.45,62.28 C645.82,72.87 650.18,79.99 654.55,79.99 C658.91,79.99 663.27,72.86 667.64,62.27 C672,51.68 676.36,40 680.73,40 C685.09,40 689.45,28.32 693.82,17.73 C698.18,7.14 702.55,0.01 706.91,0.01 C711.27,0.01 715.64,7.13 720,17.72 C724.36,28.